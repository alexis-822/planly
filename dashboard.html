u. G\u00e9nial, les enfants ont ador\u00e9, le d\u00e9cor et les \u00e9nigmes.\nNous n'\u00e9tions pas nombreux ce jour... A voir en forte affluence avec plusieurs groupes dans la m\u00eame salle \u00e7a peut \u00eatre plus compliqu\u00e9. (Pour la discr\u00e9tion des \u00e9nigmes).\nPour info : il y a des escaliers dans le ch\u00e2teau donc pas adapt\u00e9 au  PMR\n\nLe tarif reste cher pour une activit\u00e9.\nVous pouvez avoir des tarifs pour faire ttes les activit\u00e9s si vous les prenez en avance.\nJe recommande","rating":4,"date":"2026-04-17 14:54:50 +00:00","owner_response":"Merci pour votre retour, nous sommes ravis que vous ayez appr\u00e9ci\u00e9 notre aventure Enqu\u00eate au ch\u00e2teau. Nous avons bien une version PMR pour cette aventure qui permet de ne faire que le rez de chauss\u00e9. A bient\u00f4t pour de nouvelles aventures."},{"text":"Tr\u00e8s chouette exp\u00e9rience en famille. Nous avons fait la qu\u00eate des pirates, c'\u00e9tait original et vari\u00e9. Des jeux d'eau ou des brumisateurs auraient \u00e9t\u00e9 super appr\u00e9ciables et appr\u00e9ci\u00e9s. Puis pause snack, tarifs un peu \u00e9lev\u00e9s. Et nous avons fait l'enqu\u00eate au ch\u00e2teau, tr\u00e8s original aussi. Des points pour s'asseoir seraient une bonne id\u00e9e. Pas le courage d'aller faire les dinos par ce temps m\u00eame si c'est en for\u00eat. La boutique est sympa. Bref un tr\u00e8s bon moment en famille, \u00e0 recommander !","rating":4,"date":"2026-07-09 13:06:51 +00:00","owner_response":"Merci pour cette belle note, vous semblez avoir pass\u00e9 un bon moment en famille sur notre parc et nous en sommes tr\u00e8s heureux. A bient\u00f4t"},{"text":"Une tr\u00e8s belle d\u00e9couverte, nous recommandons !\nVenus en famille avec deux adolescents de 13 et 14 ans, nous avons pris le pack Grand Frisson et y avons pass\u00e9 une tr\u00e8s bonne partie de la journ\u00e9e (de 10h15 \u00e0 16h). Les activit\u00e9s ont plu \u00e0 tout le monde, balayant nos doutes sur le c\u00f4t\u00e9 potentiellement trop enfantin pour leur \u00e2ge. L'escape game de la maison hant\u00e9e a d'ailleurs \u00e9t\u00e9 le coup de c\u0153ur de notre journ\u00e9e.\nLe site est superbe : le ch\u00e2teau est tr\u00e8s beau et le grand parc, ainsi que le sentier bois\u00e9 de la piste des dinos, sont parfaitement entretenus.\nPr\u00e9voyez votre pique-nique car peu de choix en snack.","rating":5,"date":"2026-07-12 21:30:50 +00:00","owner_response":"<br>Merci pour cette excellente note et votre commentaire. Nous sommes ravis que nos diff\u00e9rentes aventures aient plu \u00e0 toute la famille ! A bient\u00f4t<br>"},{"text":"Parfait pour occuper un amateur de pirate, de dinosaure ou de Cluedo.\n\nVisiter un ch\u00e2teau o\u00f9 le crime parfait a \u00e9t\u00e9 commis tout en d\u00e9couvrant un ch\u00e2teau et ses jolis tr\u00e9sors.\n\nDe belles animations o\u00f9 l'on oublie l'\u00e9cran, le portable en pleine nature dans un cadre bucolique.\n\nDes \u00e9nigmes, complexes comme facile. \u00c0 faire en famille.\n\nBoutique o\u00f9 vous laisserez quelques pi\u00e8ces d'or, caf\u00e9t\u00e9ria.\n\nPossibilit\u00e9 de pique niquer sur place. Parking gratuit.\n\nLa maison hant\u00e9e sera \u00e0 faire d\u00e8s que notre enfant sera plus grand.","rating":5,"date":"2026-04-25 06:52:33 +00:00","owner_response":"Merci beaucoup ! Nous sommes heureux que l\u2019univers du parc vous ait plu. De nouvelles aventures vous attendent lors de votre prochaine visite "},{"text":"Nous avons pass\u00e9s une formidable journ\u00e9e !\nC'est vraiment une reconnection \u00e0 la nature.\nLe parc est vraiment propre et bien entretenu. La nouvelle activit\u00e9 de la maison hant\u00e9 est tout simplement g\u00e9nial !\nNous y retournerons.","rating":5,"date":"2026-06-15 09:02:10 +00:00","owner_response":"Merci beaucoup pour cette excellente note et votre commentaire qui nous font r\u00e9ellement tr\u00e8s plaisir ! Nous sommes tr\u00e8s heureux de voir que vous avez pass\u00e9 une bonne journ\u00e9e en famille sur notre parc et avez pu partager de bons moments avec vos enfants dans notre escape game La Maison Hant\u00e9e. A bient\u00f4t pour de nouvelles aventures !"}],"place_topics":{"pirates":707,"\u00e9nigmes":674,"maison hant\u00e9e":392,"escape game":191,"cluedo":119,"chasse au tr\u00e9sor":119,"western":78,"jeu de piste":39,"dinos":37,"menhirs":17},"booking_url":null,"cid":"3092512066561162257","place_id":"ChIJ1xvB2mQWBEgREbz89lbP6io","wikipedia_description":"Le ch\u00e2teau de la Guignardi\u00e8re est un ch\u00e2teau situ\u00e9 \u00e0 Avrill\u00e9, dans le d\u00e9partement de la Vend\u00e9e, en r\u00e9gion Pays-de-la-Loire. L\u2019\u00e9difice occupe une place centrale au sein du parc de loisirs d\u00e9nomm\u00e9 \u00ab Le ch\u00e2teau des Aventuriers \u00bb.","description_short":"Chasses au tr\u00e9sor, escape game et maison hant\u00e9e dans un vrai ch\u00e2teau vend\u00e9en. Une aventure palpitante pour toute la famille !","description_long":"Au c\u0153ur d'un parc verdoyant \u00e0 Avrill\u00e9, le Ch\u00e2teau des Aventuriers vous plonge dans un univers magique m\u00ealant pirates, dinosaures, Cluedo et maison hant\u00e9e. Dans le cadre authentique du ch\u00e2teau de la Guignardi\u00e8re, vivez des qu\u00eates et \u00e9nigmes soigneusement sc\u00e9naris\u00e9es pour petits et grands. Les packs th\u00e9matiques \u2013 comme le Grand Frisson \u2013 permettent de passer une journ\u00e9e enti\u00e8re \u00e0 explorer. D\u00e9cors soign\u00e9s, jeux de piste vari\u00e9s et animations surprenantes font de ce lieu une exp\u00e9rience de loisirs compl\u00e8te, avec restauration et snack sur place pour prolonger la visite.","tags":["chasse au tr\u00e9sor","escape game","pirates","ch\u00e2teau","maison hant\u00e9e"],"audience":["famille","couple","ados"],"age_min":5,"weather_ok":["sunny","cloudy","rainy"],"duration_min":180,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":false,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":true,"conseil_planly":"R\u00e9servez vos billets \u00e0 l'avance, surtout en juillet-ao\u00fbt ! Optez pour le pack journ\u00e9e pour profiter de plusieurs qu\u00eates et \u00e9viter la frustration d'en vouloir encore plus.","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T16:27:13.306211+00:00","enriched_at":"2026-09-14T16:27:13.306211+00:00","status":"complete","photos_original_urls":["https://chateau-aventuriers.com/wp-content/uploads/2024/01/Poster-Video-Home.jpg","https://dynamic-media-cdn.tripadvisor.com/media/photo-o/17/52/b2/1e/parcours-des-pirates.jpg?w=1200&h=1200&s=1","https://www.chausseliere.com/wp-content/uploads/2023/01/ChateaudesAventuriers1_1199_800-1024x683.webp"]},{"id":"o_fun_park","name":"O'Fun Park","name_google":"O'Fun Park - Parc d'attractions Vend\u00e9e - Accrobranche, waterjump, paintball, EVC...","category":"Parcs & Loisirs","subcategory":"Jeux & Divertissement","commune":"Le Bernard","zone":null,"poi_format":"poi","lat":46.4816558,"lng":-1.4183112,"address":"85560 Le Bernard","phone":"+33251481212","website":"https://ofunpark.fr/","rating":4.1,"reviews_count":4044,"rating_distribution":{"1":352,"2":220,"3":380,"4":952,"5":2140},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/o_fun_park/photo_1.jpg","images/o_fun_park/photo_2.jpg","images/o_fun_park/photo_3.jpg"],"reviews":[{"text":"Super week-end plein d'activit\u00e9s 8 et 9 mai 2026 (2 adultes + 1 enfant de 4 ans). J'ai l'habitude de venir 1x par an pour le boulo au 2 park. Pr\u00e9f\u00e9rence pour Ofun, embiance beaucoup plus familiale que Ogliss qui fait plus conso pour pions touristique.\nL'ensemble du pak ave le th\u00e8me refait en grande pompe cet ann\u00e9e est g\u00e9nial ! Ma fille a ador\u00e9 O'pik (la mascotte) merci a tous les employ\u00e9s qui ont jou\u00e9 son r\u00f4le, dans\u00e9 et fait des c\u00e2lins \u00e0 petit et grand \ud83d\ude02 .\nLe kart a p\u00e9dale est son activit\u00e9 pr\u00e9f\u00e9r\u00e9e m\u00eame si elle a tout ador\u00e9.  Dommage que la moitier des karts bleu soit HS par contre ( pneu d\u00e9gonfl\u00e9 ou a plat et direction cass\u00e9es) et que les grand toboggan des structures gonflables soit tr\u00e8s salle.\nPoint un peu n\u00e9gatif sur la restauration, \u00e7a manque de l\u00e9gumes frais \u00e0 la vente du snack.\n\u00c7a suffit les points n\u00e9gatifs \ud83d\ude1ctout le reste \u00e9tait que du positif \ud83d\ude0d\ud83e\udd29 et le fait d'avoir un tarif pour pouvoir participer \u00e0 ce qu'on veut dans le parc est g\u00e9nial. Car sans \u00e7a nous n'aurions jamais fait l'accrobranche. Le tarif aurait \u00e9t\u00e9 trop \u00e9lev\u00e9 pour le peu que puisse faire un enfant en bas \u00e2ge.\n\nTous les employ\u00e9s \u00e9taient tr\u00e8s sympa. Certains ne vont pas \u00eatre content de mon avis google car on va remercier plein de monde \ud83e\udd23\ud83d\ude18\n\nMention sp\u00e9ciale pour les plus cool que nous avons rencontr\u00e9 \ud83d\ude01\ud83e\udd29le sourir, la sympathie et les echanges avec :\n\nVendredi\nAprem, jeune fille du magasin au water.  M\u00eame si 56\u20ac pour 1 maillot et une serviette ma ruin\u00e9 \ud83e\udd2a\nSoir, mur d'escalade, jeune fille rigolotte avec un petit accent, hyper joviale \ud83d\ude04\n\nSamedi\nmatin, les gars de l'accrobrache \ud83d\ude0e hyper sympa ! Ma fille a pu faire les oursons vendredi apr\u00e8s-midi et ce samedi matin elle a r\u00e9ussi les deux petits parcours violet c'\u00e9tait g\u00e9nial!!!\nD\u00e9but d'apr\u00e8s midi,  la jeune fille qui adore son boulo avec les lapins et les ponets\ud83e\udd70\nPuis, celle des photos \ud83d\udcf8\n\nBonne saison \u00e0 tous \ud83c\udf35","rating":5,"date":"2026-05-10 07:08:02 +00:00","owner_response":"Bonjour et merci d\u2019avoir pris le temps de partager votre exp\u00e9rience si d\u00e9taill\u00e9e.<br><br>Nous sommes ravis de lire que vous avez pass\u00e9 un excellent week-end en famille et que l\u2019ambiance familiale du parc a pleinement r\u00e9pondu \u00e0 vos attentes. Votre enthousiasme pour les animations, la mascotte O'Pik ainsi que les activit\u00e9s comme le kart \u00e0 p\u00e9dales nous fait tr\u00e8s plaisir.<br><br>Nous prenons note de vos remarques concernant l\u2019\u00e9tat des karts bleus et la propret\u00e9 des toboggans gonflables, ainsi que votre retour sur la restauration. Vos observations sont pr\u00e9cieuses pour mieux comprendre les attentes de nos visiteurs.<br><br>Merci \u00e9galement pour vos compliments envers notre \u00e9quipe ; ils seront heureux d\u2019apprendre qu\u2019ils ont contribu\u00e9 \u00e0 rendre votre s\u00e9jour agr\u00e9able.<br><br>Nous vous souhaitons une tr\u00e8s belle journ\u00e9e.<br><br>L'\u00e9quipe de O' Fun Park"},{"text":"Tr\u00e8s tr\u00e8s bonne surprise,\nAyant \u00e9t\u00e9 chez la concurrence je m'attendais \u00e0 passer une bonne journ\u00e9e mais sans plus.\nAu final j'ai pass\u00e9 une incroyable journ\u00e9e en famille,\nLe concept de votre parc et genial.\nLes personnes travaillant chez vous sont tr\u00e8s accueillants et tellement \u00e0 l'\u00e9coute.\nNous nous sommes r\u00e9gal\u00e9s merci \u00e0 vous toutes et tous vous avez \u00e9t\u00e9 g\u00e9niaux. \ud83d\udc4c\ud83d\udc4d\ud83d\udc4d\ud83d\udc4d\ud83d\udc4d","rating":5,"date":"2026-08-30 07:50:14 +00:00","owner_response":"Bonjour,<br><br>Merci beaucoup Jonathan Lefebvre pour votre superbe avis. Nous sommes ravis que votre journ\u00e9e en famille ait \u00e9t\u00e9 une si belle surprise et que le concept de notre parc de loisirs vous ait plu. Votre retour sur l\u2019accueil et l\u2019\u00e9coute de nos \u00e9quipes nous touche particuli\u00e8rement. Au plaisir de vous revoir pour de nouvelles aventures, sensations et activit\u00e9s outdoor \u00e0 O' Fun Park !<br><br>L\u2019\u00e9quipe O\u2019 Fun Park"},{"text":"Journ\u00e9e genialissime !\nJe suis partie en famille avec mon grand de 10 ans et mes 2 petites jumelles de 4 ans et je suis ravie de ma journ\u00e9e.\nC\u2019est un parc avec une vraie th\u00e9matique Western qui se d\u00e9cline dans tous les univers avec la petite mascotte cactus et le personnel en tenu de cowboys.\nIl est tr\u00e8s bien d\u00e9cor\u00e9 et bien entretenu, et le personnel est chaleureux et au petit soin pour nous guider.\nAdapt\u00e9 pour tous les \u00e2ges, mes filles se sont \u00e9clat\u00e9es \u00e0 l\u2019 orpailleur,  jeux gonflable, accrobranche, les balades \u00e0 poneys \u2026 mon grand a pu profiter de tout le parc, il a fait bcp d\u2019accrobranche et le water Jump  ! Nous avons appr\u00e9ci\u00e9 de d\u00e9jeuner au restaurant le midi.\nNous sommes rest\u00e9s jusqu\u2019\u00e0 la fermeture pour profiter pleinement de cette journ\u00e9e m\u00e9morable : \u00e0 refaire !\nMerci au personnel d\u2019O fun Park","rating":5,"date":"2026-07-21 18:54:17 +00:00","owner_response":"Bonjour Chlo\u00e9,<br><br>Merci beaucoup pour votre avis et vos retour sur l'ensemble du parc \ud83d\ude4f\ud83c\udffc Nous adorons lire le r\u00e9cit de votre journ\u00e9e.<br>Nous serons heureux de vous retrouver \u00e0 O' Fun Park pour de nouvelles activit\u00e9s outdoor en famille, entre aventure, sensations et jeux.<br><br>L\u2019\u00e9quipe O\u2019 Fun Park"},{"text":"Super parc ! Tr\u00e8s agr\u00e9ablement surprise de red\u00e9couvrir le parc avec cette th\u00e9matique Western \u2764\ufe0f J'ai surtout pu profiter de l'espace Explorer camp et le parcours dans les Arbres pour les petits. Explorer camp est tr\u00e8s bien con\u00e7u, tr\u00e8s ombrag\u00e9 le matin comme l'apr\u00e8s midi ! Les pelleteuses, l'orpaillage et le parcours de billes ont remport\u00e9 un grand succ\u00e8s sans oublier le grand espace jeux et ch\u00e2teaux gonflables..\nLe personnel est agr\u00e9able et serviable et le parc tr\u00e8s propre !\nLa formule 2026 permettant un acc\u00e8s \u00e0 tout pour un tarif \u00e0 la journ\u00e9e est super ! Juste petit b\u00e9mol le tarif est par cons\u00e9quent plus \u00e9lev\u00e9 (c'est justifi\u00e9) mais lorsque l'on est seulement accompagnateur car seule adulte avec deux enfants un tarif aurait pu peut-\u00eatre \u00eatre pens\u00e9 car cela fait tr\u00e8s cher la journ\u00e9e seulement pour accompagner... Sinon rien \u00e0 redire","rating":5,"date":"2026-06-17 18:30:01 +00:00","owner_response":"Bonjour,<br><br>Merci pour votre retour enthousiaste. Nous sommes ravis que la th\u00e9matique Western, l\u2019espace Explorer camp et le parcours dans les arbres pour les petits vous aient autant plu. Votre mention du personnel agr\u00e9able, de la propret\u00e9 du parc de loisirs et des jeux comme l\u2019orpaillage, les pelleteuses et les ch\u00e2teaux gonflables nous touche beaucoup. Merci aussi pour votre remarque sur la formule 2026. Au plaisir de vous revoir en famille pour de nouvelles aventures.<br><br>L\u2019\u00e9quipe O\u2019 Fun Park"},{"text":"Nous avons pass\u00e9 une super journ\u00e9e \u00e0 O\u2019Fun Park ! \ud83d\ude0a\n\nL\u2019accrobranche est vraiment au top, avec de tr\u00e8s beaux parcours et surtout des parcours parfaitement adapt\u00e9s aux tr\u00e8s jeunes enfants. Les parcours aquatiques sont \u00e9galement excellents, de quoi bien profiter et s\u2019amuser en famille !\n\nQuelques petits points \u00e0 am\u00e9liorer selon nous : il semble y avoir un manque de coordination concernant le remboursement des billets pour les gants d\u2019accrobranche. Chacun nous donnait une r\u00e9ponse diff\u00e9rente, en nous disant parfois oui, parfois non. Nous avons finalement r\u00e9ussi \u00e0 obtenir le remboursement, mais cela pourrait \u00eatre beaucoup plus simple et clair.\n\nConcernant la balade \u00e0 poney, nous avons \u00e9galement \u00e9t\u00e9 surpris de devoir accompagner nous-m\u00eames les enfants, sans accompagnateur du parc. En cas de probl\u00e8me pendant la balade, personne du parc n\u2019est pr\u00e9sent pour intervenir, ce qui nous para\u00eet un peu dommage, notamment avec de jeunes enfants.\n\nMalgr\u00e9 ces quelques remarques, nous avons pass\u00e9 une tr\u00e8s bonne journ\u00e9e en famille et nous recommandons largement O\u2019Fun Park ! \ud83d\udc4d\ud83d\ude0a","rating":4,"date":"2026-08-24 17:34:44 +00:00","owner_response":"Bonjour,<br><br>Merci Antoine G pour votre avis et votre recommandation. Nous sommes ravis que votre journ\u00e9e en famille \u00e0 O' Fun Park ait \u00e9t\u00e9 une r\u00e9ussite, notamment gr\u00e2ce \u00e0 l\u2019accrobranche, aux parcours adapt\u00e9s aux jeunes enfants et aux activit\u00e9s aquatiques.<br><br>Nous prenons note de vos remarques concernant les gants et la balade \u00e0 poney, et comprenons votre ressenti. Si besoin, notre \u00e9quipe reste disponible pour \u00e9changer directement avec vous. Au plaisir de vous accueillir \u00e0 nouveau pour de nouvelles aventures, sensations et jeux en famille.<br><br>L\u2019\u00e9quipe O\u2019 Fun Park"}],"place_topics":{"duel":100,"animateurs":72,"poney":69,"tyrolienne":34,"saisonniers":30,"western":25,"rom\u00e9o":22,"o'gliss park - parc aquatique vend\u00e9e":21,"cascadeur":39,"d&o":8},"booking_url":null,"cid":"14082634491891990695","place_id":"ChIJzwXM1kkYBEgRp8DiFnWRb8M","wikipedia_description":null,"description_short":"Le plus grand parc de loisirs de Vend\u00e9e avec accrobranche, aquapark g\u00e9ant et th\u00e9matique Western au c\u0153ur du Bernard !","description_long":"O'Fun Park, c'est une journ\u00e9e XXL en famille au c\u0153ur du Bernard, dans une ambiance Western authentique et chaleureuse. Accrobranche pour tous niveaux, Water Jump, Paintball, Tyrolienne aquatique et le plus grand Aquapark de la r\u00e9gion : les sensations sont au rendez-vous de 4 \u00e0 77 ans. En 2026, le parc s'agrandit avec Gold Rush, une zone aquasplash interactive, et une Mini-Ferme p\u00e9dagogique. Animations avec cascadeurs, poneys et duels de cowboys rythment la journ\u00e9e. Parking gratuit, acc\u00e8s PMR, restauration sur place : tout est pens\u00e9 pour profiter sans contrainte.","tags":["accrobranche","aquapark","western","paintball","famille"],"audience":["famille","ados","couple"],"age_min":3,"weather_ok":["sunny","cloudy"],"duration_min":180,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":false,"is_indoor":false,"has_height":true,"animals_captive":true,"rainy_day_activity":false,"conseil_planly":"Achetez vos billets en ligne \u00e0 l'avance pour \u00e9viter la file d'entr\u00e9e, et arrivez t\u00f4t pour profiter de l'Aquapark avant l'affluence de l'apr\u00e8s-midi. Pr\u00e9voyez la journ\u00e9e compl\u00e8te : entre l'accrobranche, les spectacles Western et les jeux d'eau, les 3h minimum passent tr\u00e8s vite !","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T16:29:17.703320+00:00","enriched_at":"2026-09-14T16:29:17.703320+00:00","status":"complete","photos_original_urls":["http://cdt44.media.tourinsoft.eu/upload/OFun-Park-Mehdi-Media-12.jpeg","https://i.ytimg.com/vi/zrf8l8EEgbg/maxresdefault.jpg","https://ofunpark.fr/wp-content/uploads/2022/10/activites_enfants_en_vendee.webp"]},{"id":"zoo_des_sables_d_olonne","name":"Zoo des Sables d'Olonne","name_google":"Zoo des Sables d'Olonne","category":"Parcs & Loisirs","subcategory":"Parcs animaliers","commune":"Les Sables-d'Olonne","zone":null,"poi_format":"poi","lat":46.484142999999996,"lng":-1.755827,"address":"Rte du Tour de France, 85100 Les Sables-d'Olonne","phone":"+33251951410","website":"http://www.zoodessables.fr/","rating":4.2,"reviews_count":8621,"rating_distribution":{"1":213,"2":346,"3":1026,"4":2873,"5":4163},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/zoo_des_sables_d_olonne/photo_1.jpg","images/zoo_des_sables_d_olonne/photo_2.jpg","images/zoo_des_sables_d_olonne/photo_3.jpg"],"reviews":[{"text":"Ce \"petit\" zoo n'est pas si petit, il y a de quoi faire ! Nous sommes arriv\u00e9s \u00e0 l'ouverture et repartis un peu avant midi, donc un peu plus de 2h sur place. Nous avons pris le temps d'observer les animaux et assister \u00e0 2 pr\u00e9sentations (celle des manchots est tr\u00e8s sympa comme on peut les voir plonger pour manger et nager dans l'eau par la vitre devant les gradins).\nOn a pass\u00e9 un super moment avec un enfant de 3 ans et une ado.","rating":5,"date":"2026-07-30 08:55:28 +00:00","owner_response":null},{"text":"Une tr\u00e8s belle surprise !\nUne visite au top ! Nous avons \u00e9t\u00e9 agr\u00e9ablement surpris par la quantit\u00e9 d'animaux pr\u00e9sents et surtout par leur dynamisme, pourtant actifs malgr\u00e9 la chaleur. Nous avons pu admirer de magnifiques girafes, des singes tr\u00e8s joueurs, et nous avons m\u00eame assist\u00e9 \u00e0 une petite sc\u00e8ne de m\u00e9nage hilarante chez les lions ! Parc ombrag\u00e9 ce qui est agr\u00e9able en \u00e9t\u00e9.\nMention sp\u00e9ciale pour la possibilit\u00e9 de nourrir les oiseaux, une exp\u00e9rience vraiment immersive et sympa pour petits et grands.\nSeul petit b\u00e9mol: dommage qu'il n'y ait pas de tarif famille propos\u00e9, ce qui all\u00e9gerait un peu le budget. Mais dans l'ensemble, c'est un parc que nous recommandons sans h\u00e9sitation !","rating":5,"date":"2026-08-03 14:19:15 +00:00","owner_response":null},{"text":"D\u00e9couverte immersive en plus ou moins deux heures. Tout public et agr\u00e9able le long d\u2019all\u00e9es ombrag\u00e9es. Une grande vari\u00e9t\u00e9 d\u2019esp\u00e8ces avec un accent mis sur la proximit\u00e9 avec les animaux : nectar \u00e0 1\u20ac pour nourrir des oiseaux (loriquets). Le zoo permet une sensibilisation p\u00e9dagogique aux divers enjeux environnementaux, et promeut la pr\u00e9servation des esp\u00e8ces menac\u00e9es.","rating":5,"date":"2026-07-02 15:42:41 +00:00","owner_response":null},{"text":"Un sublime \"petit\" parc zoologique. Probablement l'un des plus jolis et des mieux entretenu que nous ayons visit\u00e9 ! Le cadre est idyllique et tr\u00e8s naturelle. Tous les animaux sont magnifiques et semblent en pleine forme.  C'est vrai plaisir d'arpenter les petits chemins qui regorgent d'informations diverses sur la faune et la flore du parc. Une mention toute particuli\u00e8re pour la possibilit\u00e9 d'acheter un petit pot de nectar \u00e0 donner au oiseaux dans la voli\u00e8re d\u00e8s l'entr\u00e9e du parc et croyez-moi vous serez attendus ! Les oiseaux ont du nectar \u00e0 disposition mais ils pr\u00e9f\u00e8rent visiblement bien plus celui offert par les visiteurs ! A faire absolument ! Il y a \u00e9galement des pr\u00e9sentations int\u00e9ressantes \u00e0 diff\u00e9rents horraires (manchots, oiseaux, capybara...). Parc \u00e0 visiter absolument ! Tr\u00e8s peu de monde le matin \u00e0 l'ouverture et parking gratuit directement devant.","rating":5,"date":"2026-07-20 12:08:31 +00:00","owner_response":null},{"text":"\u00c9tant de grand amateurs de zoo et \u00e9tant de passage aux sables, nous ne pouvions que faire une halte dans celui-ci.\n\nNous n\u2019avions aucun a priori sur ce zoo car jamais entendu parl\u00e9, donc nous y sommes all\u00e9s sans savoir \u00e0 quoi s\u2019attendre.\n\nD\u00e8s le d\u00e9but agr\u00e9ablement surpris, des toilettes tr\u00e8s propres.\n\nEt on commence la visiter, annonc\u00e9e 1h30.\n\nL\u2019int\u00e9gralit\u00e9 du parc ou presque est extr\u00eamement bien couverte, arbor\u00e9e dans sa quasi int\u00e9gralit\u00e9 ce qui est incroyable aussi bien pour nous que pour les animaux .\n\nLes enclos sont grands, vraiment bien am\u00e9nag\u00e9s et c\u2019est super agr\u00e9able \u00e0 parcourir!\n\nUn vrai bonheur de voir ce genre d\u2019installation !\n\nNous reviendrons pour sur!","rating":5,"date":"2026-06-20 22:13:36 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"12523434607002497078","place_id":"ChIJE4xgpxJoBEgRNrA3TmwtzK0","wikipedia_description":null,"description_short":"Un zoo surprenant aux all\u00e9es ombrag\u00e9es, o\u00f9 la proximit\u00e9 avec les animaux fait toute la diff\u00e9rence. Une belle escapade pour petits et grands !","description_long":"Nich\u00e9 dans un cadre naturel et idyllique aux Sables-d'Olonne, le Zoo des Sables offre une exp\u00e9rience immersive et conviviale pour toute la famille. Malgr\u00e9 sa taille modeste, il r\u00e9serve de belles surprises avec une grande vari\u00e9t\u00e9 d'esp\u00e8ces animales, toutes pr\u00e9sent\u00e9es dans des enclos soign\u00e9s et bien entretenus. Les all\u00e9es ombrag\u00e9es rendent la visite agr\u00e9able m\u00eame en plein \u00e9t\u00e9. Points forts : la proximit\u00e9 avec les animaux, l'ambiance verdoyante et l'atmosph\u00e8re d\u00e9tendue. Comptez environ 2 heures pour profiter pleinement du site sans vous presser.","tags":["zoo","animaux","famille","nature","sortie enfants"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"pepite","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":false,"is_indoor":false,"has_height":false,"animals_captive":true,"rainy_day_activity":false,"conseil_planly":"Arrivez d\u00e8s l'ouverture pour observer les animaux \u00e0 leur meilleur ! Les familles appr\u00e9cieront l'option nectar \u00e0 1\u20ac pour nourrir certaines esp\u00e8ces, un moment magique pour les enfants.","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T19:02:30.298625+00:00","enriched_at":"2026-09-14T19:02:30.298625+00:00","status":"complete","photos_original_urls":["https://www.zoodessables.fr/wp-content/uploads/2025/05/Girafes-2025-2.jpg","https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0f/ad/ab/14/zoo-des-sables-d-olonne.jpg?w=1200&h=-1&s=1","https://www.culturadvisor.com/app/uploads/2024/08/Zoo-des-Sables-dOlonne-vendee.jpg"]},{"id":"anes_passions","name":"\u00c2nes Passions","name_google":"\ es petits et gratuit\u00e9 pour les touts petits.\nLes aquariums sont propres et bien entretenues, avec beaucoup d\u2019esp\u00e8ces diff\u00e9rentes notamment un superbe requin l\u00e9opard. La boutique ravira toute la famille avec un large choix de goodies. Nous reviendrons certainement avec un immense plaisir.","rating":5,"date":"2026-04-15 11:26:21 +00:00","owner_response":"Bonjour,<br>Merci beaucoup pour votre retour ! Nous sommes ravis de lire que vous avez pass\u00e9 un agr\u00e9able moment en famille et que petits et grands ont pu s\u2019\u00e9merveiller au sein de notre aquarium.<br><br>Au plaisir de vous accueillir \u00e0 nouveau pour de nouvelles d\u00e9couvertes aquatiques !<br><br>Bien cordialement,<br>L\u2019\u00e9quipe de l\u2019Aquarium de Vend\u00e9e \ud83d\udc20"},{"text":"Nous avons visit\u00e9 cette aquarium sans grande attente particuli\u00e8re mais nous avons \u00e9t\u00e9 tres agr\u00e9ablement surpris, la qualit\u00e9 des aquarium (eau, propret\u00e9, vivacit\u00e9 des poissons,..) a chaque point  un ecran pour apprendre sur les esp\u00e8ces presentes dans le bassin correspondant est super. Pour la visite des trois hall, nous avons mis un peu plus de heures, on a pris notre temps pour bien tout voir et bien lire. En ressortant les enfants et nous \u00e9tions ravis de notre visite.","rating":5,"date":"2026-07-23 15:43:25 +00:00","owner_response":"Bonjour,<br>Merci pour votre retour ! Nous sommes ravis de lire que votre visite \u00e0 l'Aquarium de Vend\u00e9e vous a agr\u00e9ablement surpris.<br><br>Nous sommes heureux que petits et grands aient pu profiter pleinement de cette exp\u00e9rience et prendre le temps de d\u00e9couvrir nos pensionnaires.<br><br>Au plaisir de vous accueillir \u00e0 nouveau,<br>L'\u00e9quipe de l'Aquarium de Vend\u00e9e \ud83d\udc20"},{"text":"Un aquarium magnifique qui m\u00e9rite vraiment d'\u00eatre visiter ! \ud83e\udd29\nLes diff\u00e9rents bassins sont grandioses par leurs tailles et la diversit\u00e9 des poissons \u00e0 l'int\u00e9rieur ! La visite est tr\u00e8s bien organis\u00e9e et nous avons mis 1h30 pour tout voir, nous avons vraiment pris le temps de profiter de notre visite tellement nous \u00e9tions surpris, on ne s'attendait pas du tout \u00e0 cela \ud83e\udd29 l'espace MANGROVE est trop chouette on s'y croirait vraiment \ud83e\udd70\nF\u00e9licitations \u00e0 vous tous pour votre travail de soigneur, nourrisseur et \u00e0 la personne qui nous a fait vivre une belle d\u00e9couverte sur le requin l\u00e9opard \ud83d\udc4f\ud83d\ude4f\nNotre petit fils de 2 ans et demi \u00e9tait... ravis et \u00e9bloui et nous aussi \ud83e\udd29","rating":5,"date":"2026-05-21 16:53:06 +00:00","owner_response":"Bonjour,<br>Merci pour votre magnifique retour ! Nous sommes tr\u00e8s heureux de lire que vous avez appr\u00e9ci\u00e9 l\u2019exp\u00e9rience propos\u00e9e tout au long du parcours, ainsi que nos diff\u00e9rents univers, notamment l\u2019espace mangrove.<br><br>Quelle joie \u00e9galement de savoir que votre petit-fils est reparti \u00e9merveill\u00e9 \ud83d\ude0a<br><br>En esp\u00e9rant vous revoir prochainement pour de nouvelles d\u00e9couvertes, <br>\u00c0 bient\u00f4t ! <br>L'\u00e9quipe de l'Aquarium de Vend\u00e9e \ud83d\udc20"},{"text":"Un parking tr\u00e8s pratique, un acc\u00e8s simple et aucune attente gr\u00e2ce \u00e0 la borne autonome pour acheter les billets. La visite dure environ 45 minutes, avec des bassins vari\u00e9s, bien entretenus et accompagn\u00e9s d'explications claires. Une sortie agr\u00e9able, ludique et adapt\u00e9e \u00e0 un b\u00e9b\u00e9 ainsi qu'\u00e0 des adultes. Les poissons visible sont pour la plupart splendide.","rating":4,"date":"2026-08-04 07:22:56 +00:00","owner_response":null}],"place_topics":{"d\u00e9cors":100,"animations":54,"vitres":43,"tactile":42,"taille":40,"univers":37,"le tour":24,"mangrove":24,"notre temps":22,"un bon moment":19},"booking_url":null,"cid":"9692060665991412238","place_id":"ChIJU728TWlpBEgRDjr0MdMdgYY","wikipedia_description":null,"description_short":"Plongez dans les profondeurs des oc\u00e9ans du monde entier ! Bassins grandioses, d\u00e9cors immersifs et biodiversit\u00e9 marine \u00e0 couper le souffle.","description_long":"L'Aquarium de Vend\u00e9e vous invite \u00e0 un voyage aquatique unique \u00e0 travers les oc\u00e9ans du monde. Des eaux tropicales aux fonds marins temp\u00e9r\u00e9s, en passant par une impressionnante mangrove, chaque bassin r\u00e9v\u00e8le une biodiversit\u00e9 fascinante. Les aquariums, remarquables par leur taille et leur propret\u00e9, accueillent une faune marine d'une vivacit\u00e9 exceptionnelle. Bornes tactiles interactives, animations r\u00e9guli\u00e8res et d\u00e9cors soign\u00e9s rendent la visite captivante pour petits et grands. L'acc\u00e8s est facilit\u00e9 par un vaste parking gratuit, une billetterie rapide et une accessibilit\u00e9 totale aux personnes \u00e0 mobilit\u00e9 r\u00e9duite. Une halte incontournable en Vend\u00e9e, m\u00eame par temps de canicule !","tags":["aquarium","oc\u00e9an","poissons","famille","interactif"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy","rainy"],"duration_min":60,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":true,"stroller":true},"dogs_allowed":false,"is_indoor":true,"has_height":false,"animals_captive":true,"rainy_day_activity":true,"conseil_planly":"En famille, pr\u00e9voyez la visite en milieu de matin\u00e9e pour \u00e9viter l'affluence et profiter sereinement des bassins tactiles avec les enfants. En couple ou en solo, l'aquarium est id\u00e9al par forte chaleur ou jour de pluie : la climatisation et l'ambiance apaisante des fonds marins en font un refuge parfait.","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T19:05:44.315710+00:00","enriched_at":"2026-09-14T19:05:44.315710+00:00","status":"complete","photos_original_urls":[]},{"id":"parc_des_floralies","name":"Parc des Floralies","name_google":"Parc des Floralies","category":"Parcs & Loisirs","subcategory":"Parcs botaniques","commune":"La Tranche-sur-Mer","zone":null,"poi_format":"poi","lat":46.3466124,"lng":-1.448299,"address":"2 All. Jean Bart, 85360 La Tranche-sur-Mer","phone":"+33251303396","website":"https://www.vendee-tourisme.com/parc-des-floralies/la-tranche-sur-mer/loipdl085v513v1x","rating":4,"reviews_count":241,"rating_distribution":{"1":17,"2":23,"3":17,"4":67,"5":117},"opening_hours":null,"popular_times":null,"price_level":null,"photos":[],"reviews":[{"text":"Le Parc des Floralies est une tr\u00e8s belle surprise pour ceux qui cherchent un endroit calme, naturel et agr\u00e9able pour se promener en famille. Ce parc est bien am\u00e9nag\u00e9, tr\u00e8s propre et surtout tr\u00e8s fleuri, avec une grande vari\u00e9t\u00e9 de plantes, d\u2019arbres et de petits chemins ombrag\u00e9s qui invitent \u00e0 la d\u00e9tente.\n\nCe que j\u2019ai particuli\u00e8rement aim\u00e9, c\u2019est la tranquillit\u00e9 qui r\u00e8gne dans ce lieu. On peut y faire une belle pause au frais, lire un livre, se promener, ou tout simplement profiter du calme et de la nature.\n\nPour les enfants, il y a aussi une belle aire de jeux bien \u00e9quip\u00e9e, ce qui en fait un lieu parfait pour une sortie familiale. Les bancs tout au long du parcours permettent de s\u2019asseoir et de profiter du paysage en toute s\u00e9r\u00e9nit\u00e9.\n\nC\u2019est aussi un bon endroit pour pique-niquer \u00e0 l\u2019ombre, ou faire une petite sieste pendant les journ\u00e9es d\u2019\u00e9t\u00e9.\n\nSitu\u00e9 \u00e0 deux pas du centre-ville et non loin de la plage. Une belle d\u00e9couverte que je recommande vivement \u00e0 tous les amoureux de nature et de tranquillit\u00e9.","rating":4,"date":"2025-05-27 18:23:51 +00:00","owner_response":null},{"text":"Nous avons pass\u00e9 la journ\u00e9e au parc en famille. C'\u00e9tait tr\u00e8s agr\u00e9able,  ombrag\u00e9,  les jeux pour les enfants. Le snack a l'entr\u00e9e nous y avons mang\u00e9, c'\u00e9tait bon et vraiment pas excessif niveau tarif!","rating":5,"date":"2026-07-06 20:10:52 +00:00","owner_response":null},{"text":"Le parc des Floralies est tr\u00e8s bucolique.\nIl y a des poneys, des canards, des poules, des \u00e2nes, des ch\u00e8vres.\nCe jour du mois d'ao\u00fbt, il y avait aussi une exposition photo.\nPour les enfants, il y a des balades en poneys mais pas le lundi.\nIl y a \u00e0 l'entr\u00e9e du parc, une paillote pour se restaurer.","rating":5,"date":"2023-08-16 16:11:21 +00:00","owner_response":null},{"text":"Parc agr\u00e9able \u00e0 faire en famille, m\u00eame si maintenant il y a un peu moins de fleurs, \u00e7a vaut le coup d'y aller ne serait-ce que voir tous les panneaux install\u00e9s qui expliquent ce qu'\u00e9tait la vie des habitants de la Tranche sur Mer, mais il y a aussi quelques animaux, la mare aux canards. Un bon moment \u00e0 y passer !!","rating":5,"date":"2023-10-02 19:25:21 +00:00","owner_response":null},{"text":"Au calme en pleine nature avec quelques animaux pr\u00e9sents\nBalade possible en poney 10e\nJeux en bois et de soci\u00e9t\u00e9 pr\u00e9sent lors de notre parcours\nToilettes et buvette \u00e0 disposition","rating":3,"date":"2025-07-14 11:42:00 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"11594476517966295757","place_id":"ChIJ6aJWWr4PBEgRzTL9gfba56A","wikipedia_description":null,"description_short":"Un \u00e9crin de verdure fleuri et bucolique \u00e0 La Tranche-sur-Mer, id\u00e9al pour une balade en famille avec animaux et jeux pour les enfants.","description_long":"Le Parc des Floralies est un havre de paix nich\u00e9 \u00e0 La Tranche-sur-Mer, alliant nature, fleurs et convivialit\u00e9. Ce parc bien am\u00e9nag\u00e9 et ombrag\u00e9 accueille poneys, \u00e2nes, ch\u00e8vres, canards et poules, pour le plus grand bonheur des petits. Les enfants profitent de jeux en bois et de jeux de soci\u00e9t\u00e9, tandis que les ad // MÉTÉO — Open-Meteo API (Les Sables-d'Olonne)
// ═══════════════════════════════════════════
function weatherIcon(code) {
  if (code === 0) return ['☀️', 'Ensoleillé', 'sunny'];
  if (code <= 2) return ['⛅', 'Peu nuageux', 'cloudy'];
  if (code === 3) return ['☁️', 'Couvert', 'cloudy'];
  if (code >= 45 && code <= 48) return ['🌫️', 'Brouillard', 'cloudy'];
  if (code >= 51 && code <= 67) return ['🌧️', 'Pluie', 'rainy'];
  if (code >= 71 && code <= 77) return ['🌨️', 'Neige', 'rainy'];
  if (code >= 80 && code <= 82) return ['🌦️', 'Averses', 'rainy'];
  if (code >= 95) return ['⛈️', 'Orage', 'rainy'];
  return ['❓', 'Inconnu', 'cloudy'];
}

// Météo globale — stockée pour les chips
let currentWeatherType = null; // 'sunny' | 'cloudy' | 'rainy'

(function loadMeteo() {
  // Fetch marine en parallèle
  fetch('https://marine-api.open-meteo.com/v1/marine?latitude=46.4952&longitude=-1.7888&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature&timezone=Europe%2FParis&forecast_days=2&models=best_match')
    .then(r => r.json()).then(d => { marineData = d; if(document.getElementById('meteo-page').style.display!=='none')renderMeteoPage(); }).catch(() => {});
  // Marées chargées depuis tides.js (pas de fetch nécessaire)

  const url = 'https://api.open-meteo.com/v1/forecast?latitude=46.4952&longitude=-1.7888&current=temperature_2m,weathercode&hourly=weathercode,temperature_2m&timezone=Europe/Paris&forecast_days=7';
  fetch(url).then(r => r.json()).then(data => {
    meteoData = data; // Stocker pour l'onglet météo
    if(document.getElementById('meteo-page').style.display!=='none')renderMeteoPage();
    // Météo actuelle
    const cur = data.current;
    const [icon, desc, type] = weatherIcon(cur.weathercode);
    currentWeatherType = type;
    document.getElementById('meteo-current').innerHTML =
      `<span class="meteo-icon">${icon}</span><span class="meteo-temp">${Math.round(cur.temperature_2m)}°C</span><span>${desc}</span>`;

    // Prévisions 7 jours en demi-journées (matin 8-12h, après-midi 13-18h)
    const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const hourly = data.hourly;
    let forecastHtml = '';
    // Regrouper par jour
    const dayMap = {};
    hourly.time.forEach((t, i) => {
      const date = t.split('T')[0];
      const hour = parseInt(t.split('T')[1].split(':')[0]);
      if (!dayMap[date]) dayMap[date] = {am: [], pm: []};
      if (hour >= 8 && hour <= 12) dayMap[date].am.push({code: hourly.weathercode[i], temp: hourly.temperature_2m[i]});
      if (hour >= 13 && hour <= 18) dayMap[date].pm.push({code: hourly.weathercode[i], temp: hourly.temperature_2m[i]});
    });

    Object.entries(dayMap).slice(0, 7).forEach(([date, slots]) => {
      const d = new Date(date);
      const dayName = days[d.getDay()];
      const dayNum = d.getDate();
      // Moyenne des codes météo (prendre le plus fréquent)
      function dominant(arr) {
        if (!arr.length) return [null, null];
        const codes = arr.map(a => a.code);
        const maxTemp = Math.round(Math.max(...arr.map(a => a.temp)));
        // Code le plus représentatif (max)
        const code = codes.sort((a,b) => b - a)[0];
        return [code, maxTemp];
      }
      const [amCode, amTemp] = dominant(slots.am);
      const [pmCode, pmTemp] = dominant(slots.pm);
      const amW = amCode !== null ? weatherIcon(amCode) : ['—','','cloudy'];
      const pmW = pmCode !== null ? weatherIcon(pmCode) : ['—','','cloudy'];

      forecastHtml += `<div class="meteo-day">
        <span>${dayName} ${dayNum}</span>
        <div style="display:flex;gap:4px">
          <div title="Matin: ${amW[1]}"><span style="font-size:12px">${amW[0]}</span><span style="font-size:9px">${amTemp || ''}°</span></div>
          <div title="Après-midi: ${pmW[1]}"><span style="font-size:12px">${pmW[0]}</span><span style="font-size:9px">${pmTemp || ''}°</span></div>
        </div>
      </div>`;
    });
    document.getElementById('meteo-forecast').innerHTML = forecastHtml;

    // Re-render le formulaire si un POI est sélectionné (pour les chips)
    if (selectedIndex >= 0) renderForm(selectedIndex);
  }).catch(e => {
    document.getElementById('meteo-current').textContent = 'Météo indisponible';
  });
})();

// Auto-load : toujours charger les données embarquées
// Le localStorage ne sert qu'à sauver les éditions entre 2 rechargements de page
(function autoLoad() {
  console.log('[Planly] EMBEDDED_DATA:', EMBEDDED_DATA ? EMBEDDED_DATA.length + ' POIs' : 'vide');
  if (EMBEDDED_DATA && EMBEDDED_DATA.length > 0) {
    loadData(EMBEDDED_DATA);
    console.log('[Planly] Données embarquées chargées');
  } else {
    // Fallback localStorage si pas de données embarquées
    const saved = localStorage.getItem('planly_dashboard_pois');
    if (saved) {
      try {
        loadData(JSON.parse(saved));
        console.log('[Planly] Données localStorage chargées');
      } catch(e) { console.error('[Planly] localStorage corrompu', e); }
    }
  }
})();
