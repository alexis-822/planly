ch_games":"P\u00e9tanque, volley, ping-pong...","specific.facilities_sun_loungers":"Transats/parasols \u00e0 louer","specific.facilities_beach_shop":"Location mat\u00e9riel nautique"},"photos_original_urls":["https://media.ouest-france.fr/v1/pictures/MjAyNDA3ODNhMzI5ZjVhZWQwZDcxNGI5MWM4MGM1ZjE3ODhhODA?width=1260&height=708&focuspoint=50%2C25&cropresize=1&client_id=bpeditorial&sign=95b30412d15b7df95125073e5742d42148cf2310de3b89b40a25cafa379ba035","https://cdt85.media.tourinsoft.eu/upload/P8262835.JPG","https://media.ouest-france.fr/v1/pictures/MjAyNDA3OTBiYTMxMmQ0MjI3MDdmNWQ2NTk3YzU4OGNkZTI2OTA?width=1260&height=708&focuspoint=50%2C25&cropresize=1&client_id=bpeditorial&sign=4853254701271f2537a73293dbb4283da6cd486d3ad19d77413bcb26f54cdfa4"]},{"id":"foret_domaniale_d_olonne","name":"For\u00eat Domaniale d'Olonne","name_google":"For\u00eat Domaniale d'Olonne","category":"Nature & Grand Air","subcategory":"For\u00eats & Nature","commune":"Olonne-sur-Mer","zone":null,"poi_format":"poi","lat":46.552966,"lng":-1.823029,"address":"85340 Les Sables-d'Olonne","phone":"02 51 21 25 66","website":"https://www.onf.fr/vivre-la-foret/forets-de-france/+/17aa::foret-domaniale-dolonne.html","rating":4.7,"reviews_count":37,"rating_distribution":{"1":0,"2":0,"3":1,"4":10,"5":26},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/foret_domaniale_d_olonne/photo_1.jpg","images/foret_domaniale_d_olonne/photo_2.jpg","images/foret_domaniale_d_olonne/photo_3.jpg"],"reviews":[{"text":"Beaucoup de sentiers bien fl\u00e9ch\u00e9s, un peu trop peut-\u00eatre pour la tranquillit\u00e9 de la faune.. En parlant de la faune, certains endroits sont fr\u00e9quentes par des sextoyers qui laissent un peu trop de marqueurs sur leur passage ! Certains interpellent parfois les passants de fa\u00e7on un peu lourde..\nSinon la gestion sylvicole est catastrophique comme partout.\nBeaucoup de trous dans cette for\u00eat o\u00f9 ils laissent 1 ou 2 arbres mais qui au 1er coup de vent tomberont puisque plus soutenus, abrit\u00e9s par les autres..\nC'est dommage c'est une belle for\u00eat et c'est tr\u00e8s sympa de la traverser pour se rendre \u00e0 la mer mais attention on marche souvent dans le sable, \u00e7a peut \u00eatre fatiguant pour certains..","rating":4,"date":"2025-07-25 12:18:54 +00:00","owner_response":null},{"text":"Cette for\u00eat est superbe! Il y a vraiment de tr\u00e8s belles balades \u00e0 faire. Il y a diff\u00e9rentes aires qui sont des points de d\u00e9part de nombreuses marches et parkings. Aire du Menhir, Acalmie, Grande pointe... Et c'est aussi des points de pique nique avec tables. Marches toutes vraiment tr\u00e8s sympas \u00e0 faire, parfois physique \u00e0 devoir grimper des dunes. Avec des tr\u00e8s beaux points de vue \u00e0 la fin sur toute la plage. Il y a autant des randonneurs, que des familles ou des cyclistes. Et on peut terminer ses marches en allant se baigner \u00e0 la plage ! L'id\u00e9al est de continuer les marches en passant sous la D80 pour acc\u00e9der au marais. Le printemps est une magnifique p\u00e9riode, tout est en fleur, en contrastes, beaut\u00e9 des paysages et tant de faune \u00e0 voir","rating":5,"date":"2024-08-05 10:20:28 +00:00","owner_response":null},{"text":"Superbes balades \u00e0 faire.\nC\u00f4te sauvage","rating":5,"date":"2021-03-07 22:24:08 +00:00","owner_response":null},{"text":"Possibilit\u00e9 d'une belle balade en for\u00eat jusqu'\u00e0 la plage,  sans risque de se perdre car les directions sont biens fl\u00e9ch\u00e9es","rating":5,"date":"2021-09-08 08:21:41 +00:00","owner_response":null},{"text":"Superbe balade","rating":5,"date":"2025-09-04 10:51:11 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"11775926011931992937","place_id":"ChIJQ04L6ERcBEgRaSN9-lB-bKM","wikipedia_description":null,"description_short":"\u00c9chapp\u00e9e verte aux portes des Sables-d'Olonne, entre pins maritimes et c\u00f4te sauvage. Balades balis\u00e9es pour tous les niveaux !","description_long":"La For\u00eat Domaniale d'Olonne s'\u00e9tend sur plusieurs centaines d'hectares de pin\u00e8des et de sous-bois entre les Sables-d'Olonne et le littoral atlantique. Ses nombreux sentiers balis\u00e9s partent de plusieurs aires d'accueil am\u00e9nag\u00e9es \u2014 l'Aire du Menhir, l'Acalmie, Grande Pointe \u2014 et permettent de rejoindre \u00e0 pied la c\u00f4te sauvage et ses plages pr\u00e9serv\u00e9es. Id\u00e9ale pour les randonneurs, les familles et les promeneurs du dimanche, cette for\u00eat offre calme, fra\u00eecheur et une faune discr\u00e8te \u00e0 observer. Un v\u00e9ritable poumon vert accessible depuis le c\u0153ur de la station baln\u00e9aire.","tags":["randonn\u00e9e","for\u00eat","c\u00f4te sauvage","balade","nature"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":false,"walking_difficulty":false,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"En famille, partez t\u00f4t le matin depuis l'Aire du Menhir pour profiter de la fra\u00eecheur et atteindre la plage sauvage avant l'affluence. En couple ou en solo, optez pour les sentiers les plus \u00e9loign\u00e9s des parkings pour trouver une vraie s\u00e9r\u00e9nit\u00e9.","specific":{"terrain_type":"sable, dunes, sous-bois de pins maritimes","difficulty":"facile","stroller_ok":false,"bike_allowed":true,"shade_level":"\u00e9lev\u00e9","surface_ha":null,"wildlife_observation":null,"wildlife_description":null,"guided_tour":null,"guided_tour_info":null,"free_access":null,"picnic_area":null,"trail_link":null,"tide_sensitive":null,"ferry_pricing":null,"picnic_tables":85,"alltrails_url":"https://www.alltrails.com/fr/parcs/france/vendee/foret-domaniale-dolonne","komoot_url":"https://www.komoot.com/fr-fr/guide/2720992/rando-vtt-et-circuits-autour-de-la-foret-domaniale-d ir","subcategory":"For\u00eats & Nature","commune":"L'\u00cele-d'Olonne","zone":null,"poi_format":"poi","lat":46.5605312,"lng":-1.7890393999999998,"address":"85340 L'\u00cele-d'Olonne","phone":"06 83 38 53 66 (Marais Rivolia)","website":"https://www.camping-logeries.com/blog/marais-salants-ile-d-olonne-informations/","rating":4.7,"reviews_count":203,"rating_distribution":{"1":1,"2":3,"3":8,"4":37,"5":154},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/marais_salants_de_l_ile_d_olonne/photo_1.jpg","images/marais_salants_de_l_ile_d_olonne/photo_2.jpg","images/marais_salants_de_l_ile_d_olonne/photo_3.jpg"],"reviews":[{"text":"C'est une ballade tr\u00e8s agr\u00e9able \u00e0 faire. On commence par un magnifique moulin r\u00e9nov\u00e9, et ensuite on va au gr\u00e9 de ses envies selon les diff\u00e9rents chemins. On y fait \u00e9galement de belles rencontres, des \u00e9chassiers, des moutons....\nMagnifique avec la lumi\u00e8re automnale !","rating":5,"date":"2025-10-30 21:01:05 +00:00","owner_response":null},{"text":"Endroit tr\u00e8s agr\u00e9able pour ce promener et aussi avec un chien. Le seul soucis c'est qu'il n'y a que des poubelles sur le village pour les d\u00e9chets.\nL'exposition photo \u00e0 ciel ouvert est tr\u00e8s int\u00e9ressante et belle.","rating":4,"date":"2025-09-19 16:42:09 +00:00","owner_response":null},{"text":"Un v\u00e9ritable moment de qui\u00e9tude et de d\u00e9couverte au c\u0153ur de la nature ! Les paysages sont magnifiques, entre reflets d\u2019eau, teintes salines et faune locale.\n\nLa balade est facile, accessible \u00e0 tous et tr\u00e8s agr\u00e9able, surtout en fin de journ\u00e9e avec une belle lumi\u00e8re dor\u00e9e. Parfait pour les amoureux de la nature ou ceux qui cherchent un peu de calme loin de l\u2019agitation touristique.\n\nOn en apprend aussi beaucoup sur la production de sel, un savoir-faire local fascinant !\n\n\ud83c\udf3f\ud83d\udeb6\u200d\u2642\ufe0f\ud83c\udf05\ud83e\uddc2","rating":5,"date":"2025-04-15 14:08:10 +00:00","owner_response":null},{"text":"Tr\u00e8s beau lieu lorsque l\u2019on est \u00e0 la recherche d\u2019un lieu calme pour une balade.","rating":5,"date":"2025-10-05 18:37:36 +00:00","owner_response":null},{"text":"Superbe balade de plus de 7km dans les marais salants. Agr\u00e9able et au calme. Deux sentiers de randonn\u00e9e passent par l\u00e0 \u00e9galement.","rating":5,"date":"2025-11-15 08:08:00 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"18234195111503503454","place_id":"ChIJ5fGQRd1dBEgRXqBUUtjfDP0","wikipedia_description":null,"description_short":"Entre reflets d'eau et teintes salines, une balade apaisante de 7 km au c\u0153ur des marais salants de l'\u00cele d'Olonne.","description_long":"Les Marais Salants de l'\u00cele d'Olonne offrent une escapade naturelle hors du temps, \u00e0 deux pas des Sables-d'Olonne. Parcourez plus de 7 km de sentiers faciles longeant les anciennes salines, avec pour d\u00e9cor des reflets d'eau, des teintes ocre et rose des bassins, et une faune locale surprenante. La balade d\u00e9bute pr\u00e8s d'un magnifique moulin r\u00e9nov\u00e9 et se prolonge selon les envies gr\u00e2ce \u00e0 plusieurs itin\u00e9raires balis\u00e9s. Une exposition photo \u00e0 ciel ouvert enrichit la d\u00e9couverte. Lieu id\u00e9al pour se ressourcer dans le calme, accessible \u00e0 tous, animaux de compagnie bienvenus.","tags":["marais salants","randonn\u00e9e","nature","faune sauvage","balade apaisante"],"audience":["famille","couple","solo"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":false,"walking_difficulty":false,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Venez t\u00f4t le matin pour profiter des reflets dor\u00e9s sur les bassins et observer les oiseaux en toute tranquillit\u00e9. En famille, pensez \ l'oc\u00e9an arrive jusque l\u00e0. \u00c9norm\u00e9ment de monde qui viennent ramasser des hu\u00eetres, moules, bigorneaux, etc.\nAttention a bien v\u00e9rifier les heures de mar\u00e9e basse pour pouvoir y passer. Mais si vous avez l'occasion de le faire allez y, \u00e7a vaut vraiment le coup","rating":5,"date":"2025-10-09 08:43:37 +00:00","owner_response":null},{"text":"M\u00eame si nous avons emprunt\u00e9 le pont routier pour aller \u00e0 Noirmoutiers, mon ami a eu la tr\u00e8s bonne id\u00e9e de me montrer le passage du Gois, cette mythique route submersible qui permet de relier l'\u00eele au continent.\n\nC'est assez impressionnant de contempler \u00e0 mar\u00e9e basse cette immense \u00e9tendue de sable \u00e0 perte de vue avec des petits groupes de personnes pench\u00e9es vers le sol pour d\u00e9nicher des bigorneaux, palourdes et autres coquillages.\n\nOn a \u00e9galement vu les balises diss\u00e9min\u00e9es tout le long du passage pour servir de refuge aux pauvres malheureux qui se feraient surprendre par la brusque mont\u00e9e des eaux.","rating":5,"date":"2025-08-30 23:06:23 +00:00","owner_response":null},{"text":"On adore...surtout \u00e0 mar\u00e9e basse. \ud83d\ude01\ud83d\ude01\ud83d\ude01\ud83d\ude01\nEn \u00e9t\u00e9 il y a parfois beaucoup de voitures.\nEn g\u00e9neral on peut passer 2hoo avant la mar\u00e9e basse et 1h30 apr\u00e8s . Cela d\u00e9pend des coefficient de mar\u00e9e et du vent. Par fortes temp\u00eates l acc\u00e8s n est pas possible.","rating":5,"date":"2025-08-02 16:44:42 +00:00","owner_response":null},{"text":"Le passage du Gois est un endroit vraiment insolite. Quand on y passe en voiture on a du mal \u00e0 s'imaginer qu'en mar\u00e9e haute la chauss\u00e9e est recouverte de 3 \u00e0 4 m\u00e8tres d'eau...","rating":4,"date":"2025-10-02 19:00:40 +00:00","owner_response":null},{"text":"Site exceptionnel,\nAvec ses balises refuge , cette chauss\u00e9e praticable \u00e0 mar\u00e9e basse est submersible. Ici avec couleurs d\u2019aurore bor\u00e9ale.","rating":5,"date":"2025-12-30 10:42:20 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"15965239124694948828","place_id":"ChIJCyQ6GfkFBUgR3FucfWXsj90","wikipedia_description":null,"description_short":"Une route engloutie par l'oc\u00e9an : le Passage du Gois ne se d\u00e9couvre qu'\u00e0 mar\u00e9e basse. Un ph\u00e9nom\u00e8ne naturel unique en Europe \u00e0 ne pas manquer !","description_long":"Le Passage du Gois est une chauss\u00e9e submersible de 4,5 km reliant l'\u00eele de Noirmoutier au continent, praticable uniquement \u00e0 mar\u00e9e basse. Deux fois par jour, la mer se retire et d\u00e9voile cette route mythique que l'oc\u00e9an recouvre ensuite de 3 \u00e0 4 m\u00e8tres d'eau. Le spectacle est saisissant : des balises-refuges jalonnent la route pour rappeler la puissance des mar\u00e9es. Les amateurs de p\u00eache \u00e0 pied s'y retrouvent en nombre pour ramasser hu\u00eetres, moules et bigorneaux. V\u00e9rifiez imp\u00e9rativement les horaires des mar\u00e9es avant de vous lancer sur cette route hors du commun.","tags":["route submersible","mar\u00e9e basse","p\u00eache \u00e0 pied","paysage insolite","\u00eele de Noirmoutier"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Consultez les tables des mar\u00e9es avant votre visite et pr\u00e9voyez d'arriver 1h30 avant la mar\u00e9e basse pour profiter pleinement du site et faire de la p\u00eache \u00e0 pied en famille. En \u00e9t\u00e9, anticipez l'affluence et garez-vous t\u00f4t !","specific":{"terrain_type":"chauss\u00e9e pav\u00e9e submersible (4,2 km), galets et sable lat\u00e9raux","difficulty":"facile (terrain plat) \u2014 prudence mar\u00e9es obligatoire"," 025-08-14 13:52:26 +00:00","owner_response":null},{"text":"Superbe site que nous avons pu voir 3 fois sur la m\u00eame journ\u00e9e, \u00e0 marr\u00e9es basse, montante et haute (en grande mar\u00e9e). C'est vraiment spectaculaire !\nAttention toutefois \u00e0 vos enfants car ce site est \u00e0 l'\u00e9tat naturel et non s\u00e9curis\u00e9.\nVaut le coup d'\u0153il si vous passez aux Sables-d'Olonne.","rating":4,"date":"2025-09-21 17:37:56 +00:00","owner_response":null},{"text":"\ud83c\udfaf Mon verdict\n\nEn r\u00e9sum\u00e9 : \u00e0 visiter sans faute, surtout si vous aimez les lieux o\u00f9 la nature \u00ab exprime \u00bb sa puissance. Le Puits d\u2019Enfer est impressionnant, beau, charg\u00e9 de l\u00e9gendes, et offre une belle parenth\u00e8se sur la c\u00f4te vend\u00e9enne. Mais \u00e0 condition d\u2019y aller dans de bonnes conditions (temps calme, mar\u00e9e basse ou mod\u00e9r\u00e9e, prudence) et de garder un esprit respectueux de l\u2019environnement.\n\n\ud83d\udd0d Conseil perso\n\nJe vous recommanderais d\u2019y aller en fin d\u2019apr\u00e8s-midi, quand la lumi\u00e8re commence \u00e0 \u00eatre douce (vers 16h-18h selon saison) : le spectacle des vagues + lumi\u00e8re rasante rend l\u2019endroit tr\u00e8s photog\u00e9nique. Apportez un coupe-vent : m\u00eame par jour calme, la c\u00f4te \u00ab sauvage \u00bb peut souffler. Et si vous \u00eates en v\u00e9lo ou marche, pr\u00e9voir un d\u00e9tour tranquille vers ce site peut vraiment agr\u00e9menter votre s\u00e9jour.","rating":5,"date":"2025-11-09 09:00:54 +00:00","owner_response":null},{"text":"Beau site.\nNous avons \u00e9volu\u00e9 sur les rochers dans un beau cadre. Activit\u00e9 appr\u00e9ci\u00e9 par les enfants apr\u00e8s plusieurs heures de routes.\nNous l'avons fait sur la mar\u00e9e montante, ce qui fait qu'il fallait \u00eatre vigilant \u00e0 ne pas voir le chemin du retour bloqu\u00e9 par l'eau.","rating":4,"date":"2025-08-07 18:33:33 +00:00","owner_response":null},{"text":"Lieu tr\u00e8s sympa on s'est promen\u00e9s \u00e0 pieds pour y aller il avait de la glace sur les rochers, le temps \u00e9tait magnifique c \u00e9tait tr\u00e8s sympathique.","rating":4,"date":"2026-01-02 07:38:23 +00:00","owner_response":null}],"place_topics":{"mar\u00e9e":311,"vagues":96,"falaise":24,"curiosit\u00e9 naturelle":17,"coefficient":15,"houle":14,"grand vent":12,"\u00e9cume":10,"vend\u00e9enne":9,"fait divers":5},"booking_url":null,"cid":"6410761558928148512","place_id":"ChIJH20_2o9nBEgRIEikE6yZ91g","wikipedia_description":null,"description_short":"Une faille naturelle o\u00f9 l'oc\u00e9an se d\u00e9cha\u00eene avec une puissance spectaculaire. Un ph\u00e9nom\u00e8ne g\u00e9ologique unique, particuli\u00e8rement saisissant en grande mar\u00e9e.","description_long":"Le Puits d'Enfer est une curiosit\u00e9 naturelle saisissante de la c\u00f4te vend\u00e9enne : une faille creus\u00e9e dans la roche o\u00f9 les vagues s'engouffrent avec une force impressionnante. Le spectacle change radicalement selon le coefficient de mar\u00e9e \u2014 plus il est \u00e9lev\u00e9 (au-del\u00e0 de 90), plus la houle gronde, l'\u00e9cume jaillit et les embruns envahissent l'air. Id\u00e9al \u00e0 observer \u00e0 mar\u00e9e montante ou haute par fort coefficient, ce site charg\u00e9 de l\u00e9gendes offre aussi une belle promenade sur les rochers par temps calme. Un lieu o\u00f9 la nature vend\u00e9enne r\u00e9v\u00e8le toute sa puissance brute.","tags":["falaise","mar\u00e9e","ph\u00e9nom\u00e8ne naturel","point de vue","g\u00e9ologie"],"audience":["couple","solo","ados","famille"],"age_min":6,"weather_ok":["sunny","cloudy","rainy"],"duration_min":45,"notoriety":"incontournable","accessibility":{"wheelchair":false,"walking_difficulty":true,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Consultez les tables des mar\u00e9es avant votre visite et privil\u00e9giez un coefficient sup\u00e9rieur \u 'une heure entre for\u00eat, falaises et bord de mer. C'est tr\u00e8s facile et accessible. Parking gratuit avec d\u00e9part du sentier, bien indiqu\u00e9","rating":4,"date":"2025-08-24 14:27:10 +00:00","owner_response":null},{"text":"Belle balade faite en famille, presque 5 kilom\u00e8tres au total faite en 1h40 avec 2 enfants (7 et 11 ans).\nD\u00e9part avec parking facile d\u2019acc\u00e8s (bien r\u00e9f\u00e9renc\u00e9 sur Waze), une bonne partie du parcours se fait sous les arbres en for\u00eat, tr\u00e8s agr\u00e9able par forte chaleur, des magnifiques points de vue. Attention parfois du sable pas adapt\u00e9 aux poussettes.","rating":5,"date":"2025-08-01 16:23:42 +00:00","owner_response":null},{"text":"Tr\u00e8s belle d\u00e9couverte, j'ai ador\u00e9 cette balade. Balade \u00e0 la fois \u00e0 la campagne, en for\u00eat, et en bord de mer.","rating":5,"date":"2025-02-10 20:03:01 +00:00","owner_response":null},{"text":"D\u00e9part au bout du parking puis passage on suit le sentier entre for\u00eat et bord de falaise.\nTr\u00e8s facile d'acc\u00e8s pas ou peu de d\u00e9nivel\u00e9.\nCompliqu\u00e9 en poussette.\nOk avec chien en laisse.\nClich\u00e9s magnifiques au fur et \u00e0 mesure de la ballade avec un point de vue improbable \u00e0 l'arriv\u00e9e.","rating":5,"date":"2024-08-16 08:23:47 +00:00","owner_response":null},{"text":"Tr\u00e8s jolie balade le long des falaises. Comptez sur une randonn\u00e9e d'environ 1h30, niveau facile.\nUn grand bol d'air frais tr\u00e8s agr\u00e9able.","rating":5,"date":"2023-05-03 14:54:12 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"13215670542557119962","place_id":"ChIJx9BIx3ZsBEgR2gW2vVZ-Z7c","wikipedia_description":null,"description_short":"Falaises, for\u00eat et mer en un seul sentier magique. Une boucle facile et sauvage \u00e0 couper le souffle !","description_long":"La Pointe du Payr\u00e9, \u00e0 Jard-sur-Mer, offre une balade enchant\u00e9e d'environ 5 km entre for\u00eat de pins, f :null,"price_level":null,"photos":["images/le_remblai/photo_1.jpg","images/le_remblai/photo_2.jpg","images/le_remblai/photo_3.jpg"],"reviews":[{"text":"Le Remblai des Sables-d'Olonne est une tr\u00e8s belle promenade en bord de mer. Le long de ce parcours bien am\u00e9nag\u00e9 s'\u00e9tend une vue spectaculaire sur l'oc\u00e9an. D\u00e9limit\u00e9e au nord par la jet\u00e9e qui marque l'entr\u00e9e du chenal rendu c\u00e9l\u00e8bre par le Vend\u00e9e Globe, la promenade se prolonge jusqu'\u00e0 la plage de Tanchet, offrant un panorama saisissant sur la baie des Sables-d'Olonne.\nLes voies pi\u00e9tonnes et les pistes cyclables, remarquablement entretenues, accueillent joggers, cyclistes et promeneurs. De nombreux bancs et kiosques permettent de faire une pause agr\u00e9able le long du parcours.\nC\u00f4t\u00e9 ville, le front de mer du Remblai s'anime gr\u00e2ce \u00e0 ses restaurants, bars et commerces.\nLa majestueuse statue d'Ulysse, v\u00e9ritable point de rep\u00e8re, apporte une dimension culturelle qui fait du Remblai un lieu incontournable des Sables-d'Olonne","rating":5,"date":"2025-02-21 21:58:02 +00:00","owner_response":null},{"text":"Ce lieu est majestueux. Face \u00e0 l\u2019oc\u00e9an, entour\u00e9 de la ville et de la jet\u00e9e on ne peut qu\u2019\u00eatre \u00e9merveill\u00e9. Je recommande de s\u2019y promener pour le lever du soleil, il n\u2019y a pas encore trop de monde et l\u2019ambiance sera particuli\u00e8re, sous le son des mouettes\u2026\nDe plus l\u2019endroit est propre, et est pourvu de nombreuses boutiques.","rating":5,"date":"2023-10-13 13:08:42 +00:00","owner_response":null},{"text":"Superbe grande plage qui porte bien son nom, pr\u00eat de la ville, si vous voulez y aller sans payer le parking il y a des emplacements \u00e0 15 min de la plage","rating":5,"date":"2025-07-15 06:16:21 +00:00","owner_response":null},{"text":"Superbes vacances pass\u00e9es aux SABLES D'OLONNE.\nNous avons pu d\u00e9ambuler sur les Remblais.\nNous avons appr\u00e9ci\u00e9 l'authenticit\u00e9 du quartier de la CHAUME.\nNous n'avons cependant pas pu nous baigner car le temps ne nous l'a pas permis.","rating":5,"date":"2025-05-14 07:40:08 +00:00","owner_response":null},{"text":"La promenade du remblai tr\u00e8s agr\u00e9able, paysage magnifique, n\u2019oubliez pas votre glace pour vous promener tout le long de la mer \ud83c\udf0a","rating":5,"date":"2025-08-22 05:25:03 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"18082997618554020512","place_id":"ChIJ0U7b_iNnBEgRoKIluIa28_o","wikipedia_description":null,"description_short":"La promenade iconique des Sables-d'Olonne face \u00e0 l'oc\u00e9an Atlantique. Vue spectaculaire, air iod\u00e9 et animations tout au long de l'ann\u00e9e.","description_long":"Le Remblai est la promenade embl\u00e9matique des Sables-d'Olonne, s'\u00e9tirant sur plus de 2 kilom\u00e8tres en bord de mer. Face \u00e0 l'immensit\u00e9 de l'oc\u00e9an Atlantique, ce boulevard anim\u00e9 offre une vue \u00e0 couper le souffle sur les vagues et la Grande Plage. Bord\u00e9 de restaurants, glaciers et boutiques, il est le c\u0153ur battant de la ville estivale. Au nord, la jet\u00e9e ferme l'horizon tandis qu'au sud le quartier de la Chaume apporte une touche authentique. Id\u00e9al pour fl\u00e2ner au lever du soleil, profiter d'un coucher de soleil enflamm\u00e9 ou simplement savourer une glace les pieds dans le sable.","tags":["bord de mer","promenade","plage","oc\u00e9an","incontournable"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":60,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Pour une exp\u00e9rience magique, venez au lever du soleil : la lumi\u00e8re dor\u00e9e sur l'oc\u00e9an est \u00e9poustouflante et la promenade est images/circuit_des_marais_salants/photo_3.jpg"],"reviews":[{"text":"C'est une ballade tr\u00e8s agr\u00e9able \u00e0 faire. On commence par un magnifique moulin r\u00e9nov\u00e9, et ensuite on va au gr\u00e9 de ses envies selon les diff\u00e9rents chemins. On y fait \u00e9galement de belles rencontres, des \u00e9chassiers, des moutons....\nMagnifique avec la lumi\u00e8re automnale !","rating":5,"date":"2025-10-30 21:01:05 +00:00","owner_response":null},{"text":"Endroit tr\u00e8s agr\u00e9able pour ce promener et aussi avec un chien. Le seul soucis c'est qu'il n'y a que des poubelles sur le village pour les d\u00e9chets.\nL'exposition photo \u00e0 ciel ouvert est tr\u00e8s int\u00e9ressante et belle.","rating":4,"date":"2025-09-19 16:42:09 +00:00","owner_response":null},{"text":"Un v\u00e9ritable moment de qui\u00e9tude et de d\u00e9couverte au c\u0153ur de la nature ! Les paysages sont magnifiques, entre reflets d\u2019eau, teintes salines et faune locale.\n\nLa balade est facile, accessible \u00e0 tous et tr\u00e8s agr\u00e9able, surtout en fin de journ\u00e9e avec une belle lumi\u00e8re dor\u00e9e. Parfait pour les amoureux de la nature ou ceux qui cherchent un peu de calme loin de l\u2019agitation touristique.\n\nOn en apprend aussi beaucoup sur la production de sel, un savoir-faire local fascinant !\n\n\ud83c\udf3f\ud83d\udeb6\u200d\u2642\ufe0f\ud83c\udf05\ud83e\uddc2","rating":5,"date":"2025-04-15 14:08:10 +00:00","owner_response":null},{"text":"Tr\u00e8s beau lieu lorsque l\u2019on est \u00e0 la recherche d\u2019un lieu calme pour une balade.","rating":5,"date":"2025-10-05 18:37:36 +00:00","owner_response":null},{"text":"Superbe balade de plus de 7km dans les marais salants. Agr\u00e9able et au calme. Deux sentiers de randonn\u00e9e passent par l\u00e0 \u00e9galement.","rating":5,"date":"2025-11-15 08:08:00 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"18234195111503503454","place_id":"ChIJ5fGQRd1dBEgRXqBUUtjfDP0","wikipedia_des ime pour 1.10\u20ac par personne pour joindre l autre c\u00f4t\u00e9 des Sables d olonne c'\u00e9tait tres agr\u00e9able. De plus vous pouvez embarquer les v\u00e9los","rating":5,"date":"2025-08-02 11:26:58 +00:00","owner_response":null},{"text":"Super , j ai pu assister \u00e0 l arriv\u00e9e de Yohan richaume Vend\u00e9e Globe 10 eme \u00e9dition\nUne visite week end aux sables d olonne , ville tr\u00e8s sympa, grande plages , beaucoup de commerces et tr\u00e8s commer\u00e7ants tr\u00e8s agr\u00e9able\nUn site vraiment magnifique","rating":5,"date":"2025-01-16 06:50:16 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"11839075614039228854","place_id":"ChIJfehhlvRnBEgRtkHMe4vYTKQ","wikipedia_description":null,"description_short":"Le c\u0153ur battant de la voile vend\u00e9enne, berceau du Vend\u00e9e Globe et port historique de La Chaume face aux Sables-d'Olonne.","description_long":"Le port de La Chaume, nich\u00e9 \u00e0 l'entr\u00e9e du chenal des Sables-d'Olonne, est un lieu charg\u00e9 d'histoire maritime et d'\u00e9motions sportives. C'est ici que les skippers du Vend\u00e9e Globe franchissent la ligne d'arriv\u00e9e apr\u00e8s leur tour du monde en solitaire, sous les acclamations de milliers de spectateurs. Le quai Alain Gerbaud rend hommage aux grands navigateurs qui ont marqu\u00e9 l'histoire de la voile. Entre bateaux de p\u00eache color\u00e9s, odeurs iod\u00e9es et animations nautiques, le port offre une atmosph\u00e8re authentique et vivante. Une navette maritime \u00e0 prix modique permet de rejoindre facilement le centre des Sables-d'Olonne, parfaite pour explorer les deux rives.","tags":["port","voile","vend\u00e9e globe","maritime","patrimoine"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy","rainy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":false,"stroller":true},"dogs_allowed":true,"is_indoor":false,"has_height":false o_1.jpg","images/l_ile_penotte/photo_2.jpg","images/l_ile_penotte/photo_3.jpg"],"reviews":[{"text":"Un v\u00e9ritable coup de c\u0153ur !\nSe promener dans le quartier de L\u2019\u00cele Penotte est une exp\u00e9rience \u00e0 part enti\u00e8re. J\u2019ai ador\u00e9 me perdre dans ces petites ruelles pleines de charme, o\u00f9 chaque fa\u00e7ade d\u00e9cor\u00e9e de coquillages raconte une histoire. Le travail est minutieux, po\u00e9tique et vraiment impressionnant. On sent toute la passion et la cr\u00e9ativit\u00e9 qui se d\u00e9gagent de ce lieu unique.\nLa balade est tr\u00e8s agr\u00e9able, calme et d\u00e9paysante, tout pr\u00e8s de la plage, ce qui rend la visite encore plus plaisante. C\u2019est un endroit qui invite \u00e0 prendre son temps, \u00e0 observer chaque d\u00e9tail et \u00e0 profiter de l\u2019instant. Une parenth\u00e8se artistique et authentique que je recommande vivement \u00e0 tous ceux qui passent aux Sables-d\u2019Olonne.","rating":5,"date":"2026-01-19 08:05:50 +00:00","owner_response":null},{"text":"Tr\u00e8s jolie d\u00e9couverte ! Ce petit quartier, accessible gratuitement, m\u00e9rite vraiment le d\u00e9tour. On peut y admirer de nombreux dessins r\u00e9alis\u00e9s en coquillages sur les murs, tous tr\u00e8s bien faits et originaux. L\u2019endroit a beaucoup de charme et vaut la balade. \u00c0 noter toutefois que des habitants vivent dans les maisons environnantes : il est donc important de respecter les lieux en \u00e9vitant de faire trop de bruit.","rating":5,"date":"2025-09-08 06:51:23 +00:00","owner_response":null},{"text":"\u00cele Penotte \ud83d\udc1a\ud83c\udfa8 \u2014 un quartier incontournable !\nSuperbe balade dans ce quartier plein de charme, c\u00e9l\u00e8bre pour ses magnifiques mosa\u00efques en coquillages \ud83c\udf0a\u2728\nChaque ruelle est une \u0153uvre d\u2019art \u00e0 ciel ouvert, color\u00e9e et po\u00e9tique \ud83d\ude0d\nIncontournable si vous \u00eates de passage aux Sables-d\u2019Olonne \ud83c\udfd6\ufe0f\ud83d\udc4f","rating":5,"date":"2025-10-30 14:37:42 +00:00","owner_response":null},{"text":"Merci pour cette belle parenth\u00e8se ! Un quartier magnifique, avec de superbes fresques en coquillages sur les fa\u00e7ades. Bravo pour cette cr\u00e9ativit\u00e9","rating":5,"date":"2026-02-08 12:42:13 +00:00","owner_response":null},{"text":"Des \u0153uvres d'art \u00e0 chaques coins de rue.\nOn est \u00e9merveill\u00e9 \u00e0 chaque changement de rue, tr\u00e8s bien fait.\nSi vous cherchez un endroit calme et o\u00f9 vous voulez \u00eatre surpris par chaques oeuvres d'art, c'est pour vous !\nVous retrouverez de belles cr\u00e9ations ainsi qu'un tout petit magasin de rue (Avec une dame tr\u00e8s gentille et accueillante) o\u00f9 vous pourrez acheter des magn\u00e9tique et autres objets.\nJe vous invite a y aller pour de belles photos.","rating":5,"date":"2025-09-05 15:38:26 +00:00","owner_response":null}],"place_topics":null,"booking_url":null,"cid":"16127349148363554146","place_id":"ChIJMYbztPNnBEgRYn3opJraz98","wikipedia_description":null,"description_short":"Un mus\u00e9e \u00e0 ciel ouvert o\u00f9 les fa\u00e7ades s'habillent de mosa\u00efques en coquillages. Un quartier unique \u00e0 ne pas manquer aux Sables-d'Olonne !","description_long":"Nich\u00e9 dans le c\u0153ur des Sables-d'Olonne, le quartier de l'\u00cele Penotte est un v\u00e9ritable bijou artistique et populaire. Ses ruelles pittoresques d\u00e9voilent des fa\u00e7ades enti\u00e8rement recouvertes de mosa\u00efques r\u00e9alis\u00e9es en coquillages, fruits d'un travail patient et cr\u00e9atif des habitants. Chaque coin de rue r\u00e9serve une nouvelle surprise : sc\u00e8nes marines, animaux, paysages... Tout est pr\u00e9texte \u00e0 l'\u00e9merveillement. La balade, accessible gratuitement, s\u00e9duit petits et grands. Un quartier vivant, authentique et hors du commun, symbole de l'identit\u00e9 maritime et artistique sablaise.","tags":["mosa\u00efques","coquillages","balade","art urbain","quartier historique"],"audience":["famille","couple","solo","ados"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":45,"notoriety":"incontournable","accessibility":{"wheelchair":false,"walking_difficulty":true,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Venez t\u00f4t le matin pour profiter des ruelles au calme et photographier les mosa\u00efques sans trop de monde. En famille, lancez un jeu de piste en comptant les animaux cach\u00e9s sur les fa\u00e7ades !","specific":{"historical_period":"R\u00e9volution (ancien nom 'L'\u00eele perdue'), XIX\u00e8me si\u00e8cle (nom 'Penotte' apparu)","guided_visit":false,"free_entry":true},"specific_status":{"historical_period":"auto","guided_visit":"empty","free_entry":"auto"},"parking_main":{"nom":"Parking sans nom","lat":46.4948957,"lng":-1.7829262,"distance_meters":100,"is_free":null,"disabled_spaces":null},"parking_others":[{"nom":"Place du Commandant Guilbaud","lat":46.4951628,"lng":-1.7854618,"distance_meters":110,"is_free":null}],"scraped_at":"2026-04-06T15:02:19.637358+00:00","enriched_at":"2026-04-06T15:02:19.637358+00:00","status":"complete","photos_original_urls":["https://lh3.googleusercontent.com/gps-cs-s/AHVAweqj-U9S08ABF6FslHNE2yI19wftjs9WeDfWd0B-NR5y-nr4C_3qbt0Zndmk0wRAxZy4g7Zve-PnT9H1BoNhKv9PYgQVywu7EvCjs_bidDOfBRdoc0_jadTrbueKZN-QIHDJ52OS=w408-h306-k-no","https://www.lessablesdolonne.com/media/7183106625_358eb8559c_b1min__044721900_1740_13012017.jpg","https://media.ouest-france.fr/v1/pictures/MjAyMzA3ZTBmYjY3YjYxMjc4YmUwYTFlMjNlN2RhZDI5ZDllY2Y?width=1260&height=708&focuspoint=45%2C52&cropresize=1&client_id=bpeditorial&sign=949acd336336ebca250a80349ebdad6fe7c83b8bb358629ff230e451c9a0f3ec"]},{"id":"chateau_de_talmont","name":"Ch\u00e2teau de Talmont","name_google":"Ch\u00e2teau de Talmont","category":"Patrimoine","subcategory":"Villages & Sites","commune":"Talmont-Saint-Hilaire","zone":null,"poi_format":"poi","lat":46.467509799999995,"lng":-1.6184505999999999,"address":"8 Rue du Ch\u00e2teau, 85440 Talmont-Saint-Hilaire","phone":"+33251902743","website":"http://www.chateaudetalmont.com/","rating":4.4,"reviews_count":5087,"rating_distribution":{"1":96,"2":100,"3":386,"4":1516,"5":2989},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/chateau_de_talmont/photo_1.jpg","images/chateau_de_talmont/photo_2.jpg","images/chateau_de_talmont/photo_3.jpg"],"reviews":[{"text":"Une belle journ\u00e9e en famille ! Le chateau en lui m\u00eame est assez rapide \u00e0 visiter, mais \u00e0 l'int\u00e9rieur se trouve un village m\u00e9di\u00e9vale avec un atelier de costume, des stands de calligraphie, tir \u00e0 l'arbal\u00e8te, de tissage, animaux de la ferme, etc qui vont ravir petits et grands ! Deux spectacles sont propos\u00e9s : chevalerie et fauconnerie qu'il faut absolument voir ! Les chiens sont autoris\u00e9s ce qui est un vrai plus (sauf pour le spectacle de fauconnerie o\u00f9 il faut rester \u00e0 l'arri\u00e8re). Et en plus il y a des tarifs \u00e9tudiants !","rating":5,"date":"2025-09-13 10:29:19 +00:00","owner_response":"Merci pour ce beau commentaire, nous sommes ravis que vous ayez appr\u00e9ci\u00e9s notre programmation estivale !"},{"text":"Spectacle de fauconnerie au top, sauf si les oiseaux ne sont pas d\u00e9cid\u00e9s \ud83d\ude05 mais la pr\u00e9sentatrice est l\u00e0. Le ch\u00e2teau est agr\u00e9able \u00e0 visiter , il y a une fermette pour les enfants, des activit\u00e9s \u00e0 faire ( tissage, tir \u00e0 l'arbal\u00e8te...). On peut \u00e9galement porter des costumes d'\u00e9poque qui nous sont pr\u00eat\u00e9s le temps de la visite. Beaucoup de lieux pour pique-niquer et une cabane pour se restaurer.\nC'est une visite qui m\u00e9rite d'\u00eatre faite.","rating":5,"date":"2025-08-08 16:27:27 +00:00","owner_response":"Merci pour ce bel avis ! En effet, les rapaces peuvent avoir leur petit caract\u00e8re, ce qui fait la beaut\u00e9 du spectacle !  <br>Nous sommes ravis que cela vous ait plu, <br>L'\u00e9quipe du ch\u00e2teau"},{"text":"Tr\u00e8s joli endroit charg\u00e9 d histoire & 2 spectacles tr\u00e8s agr\u00e9ables et enchanteurs. (Chevaliers et oiseaux) Ainsi que des ateliers gratuits. Le personnel est tr\u00e8s gentil et bravo aux acteurs. Un beau moment le temps d' un apr\u00e8s midi","rating":4,"date":"2025-08-20 15:17:51 +00:00","owner_response":"Ravis que la visite du ch\u00e2teau vous ait conquis, merci pour ce bel avis !"},{"text":"Tr\u00e8s bonne surprise ! Spectacle qui nous tiens attentif, celui des oiseaux \u00e9galement.\nLes ateliers sont int\u00e9ressants et disponibles. Les enfants sont ravis de se d\u00e9guiser ou de tirer \u00e0 l'arbal\u00e8te.\nJe n'ai pas vu le temps passer de 12h a 19h.\nPetit b\u00e9mol,  je n'ai pas pu acc\u00e9der au souterrain  car l'acc\u00e8s y est interdit pdt \u0301la pr\u00e9paration et le spectacle.","rating":5,"date":"2025-08-30 12:04:25 +00:00","owner_response":"Merci Lionel pour cette belle note! <br>L'\u00e9quipe du ch\u00e2teau <br>"},{"text":"Un joli ch\u00e2teau avec de belles animations (tir \u00e0 l'arbal\u00e8te,  \u00e9criture \u00e0 la plume et tissage) , tout \u00e7a compris dans le prix. Plus les 2 spectacles ( chevaliers et oiseaux) avec des personnes tr\u00e8s sympathiques. Le clou, c'est le petit coin restauration tr\u00e8s abordable.  Trop bien","rating":5,"date":"2025-07-23 08:27:30 +00:00","owner_response":"Nous sommes ravis que votre exp\u00e9rience au ch\u00e2teau vous ait plu !"}],"place_topics":null,"booking_url":null,"cid":"10438256166207473266","place_id":"ChIJMXpfad9qBEgRcsZTza0i3JA","wikipedia_description":"Le ch\u00e2teau de Talmont est un ch\u00e2teau m\u00e9di\u00e9val en ruines qui se trouve sur la commune de Talmont-Saint-Hilaire, dans le d\u00e9partement de la Vend\u00e9e.","description_short":"Un ch\u00e2teau m\u00e9di\u00e9val en ruines plein de vie, avec spectacles de chevaliers, fauconnerie et ateliers pour petit 592","place_id":"ChIJj1-LllPmBkgRIKwJHlI3DQQ","wikipedia_description":"Vouvant (prononc\u00e9 [vu.v\u0251\u0303]) est une commune fran\u00e7aise situ\u00e9e dans le d\u00e9partement de la Vend\u00e9e, dans la r\u00e9gion Pays de la Loire.\nAncienne place forte m\u00e9di\u00e9vale d'importance, elle poss\u00e8de encore une grande partie de ses fortifications. Ses habitants sont appel\u00e9s les Vouvantaises et Vouvantais.\nLe village est class\u00e9 parmi Les Plus Beaux Villages de France depuis 1988.","description_short":"Village m\u00e9di\u00e9val class\u00e9 parmi Les Plus Beaux Villages de France, avec ses remparts et son atmosph\u00e8re hors du temps.","description_long":"Vouvant est un joyau m\u00e9di\u00e9val nich\u00e9 au c\u0153ur du bocage vend\u00e9en, class\u00e9 parmi Les Plus Beaux Villages de France depuis 1988. Ancienne place forte, le village a conserv\u00e9 une grande partie de ses fortifications, ses ruelles pav\u00e9es et son architecture d'antan. Domin\u00e9 par la tour M\u00e9lusine, vestige imposant d'un ch\u00e2teau du XIe si\u00e8cle, Vouvant offre un voyage dans le temps saisissant. Fl\u00e2nez entre les maisons de pierre, d\u00e9couvrez l'\u00e9glise romane Notre-Dame et profitez des panoramas sur les vall\u00e9es bois\u00e9es environnantes. Un village \u00e0 vivre lentement, au fil des saisons.","tags":["village_medieval","patrimoine","plus_beaux_villages","fortifications","bocage_vendeen"],"audience":["famille","couple","solo"],"age_min":0,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":false,"walking_difficulty":true,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"Partez \u00e0 la d\u00e9couverte de Vouvant en fin de matin\u00e9e pour profiter des ruelles encore tranquilles, et montez jusqu'\u00e0 la tour M\u00e9lusine pour un panorama exceptionnel sur le bocage vend\u00e9en.","speci iplace accompagn\u00e9 et a pris \u00e9norm\u00e9ment de plaisir sur une piste agr\u00e9able et bien entretenue.\n\nUn vrai plus : il y a \u00e9galement deux petits circuits sp\u00e9cialement adapt\u00e9s aux enfants, ce qui permet aux plus jeunes de profiter pleinement de l\u2019exp\u00e9rience.\n\nLe parking est facilement accessible et gratuit, ce qui est tr\u00e8s appr\u00e9ciable.\n\nEn tout cas, nous sommes ravis de cette activit\u00e9 et nous reviendrons avec plaisir. Nous recommandons sans h\u00e9siter !","rating":5,"date":"2026-07-06 06:19:48 +00:00","owner_response":"Un grand merci pour ce retour aussi complet ! \ud83d\ude04\ud83c\udfc1<br><br>Nous sommes vraiment ravis que toute la famille ait pass\u00e9 un excellent moment chez nous. Permettre aux plus jeunes de d\u00e9couvrir les sensations du karting, que ce soit en biplace avec un adulte ou sur nos circuits adapt\u00e9s aux enfants, fait pleinement partie de l\u2019exp\u00e9rience que nous souhaitons proposer chez MECAMAX.<br><br>Merci \u00e9galement pour vos mots sur l\u2019accueil, les explications de notre \u00e9quipe et la s\u00e9curit\u00e9. C\u2019est un point essentiel pour nous : prendre du plaisir, aller vite\u2026 mais toujours dans de bonnes conditions ! \ud83c\udfce\ufe0f<br><br>Au plaisir de vous revoir en famille pour une prochaine journ\u00e9e de sensations et de bons souvenirs. \ud83d\ude0a<br><br>L\u2019\u00e9quipe MECAMAX"},{"text":"Super moment hier soir au karting. L'\u00e9quipe  est au top.\nMon petit gar\u00e7on de 8 ans a pu faire du karting seul avec son fr\u00e8re et son papa pour la 1 \u00e8re  fois.\nC'\u00e9tait vraiment g\u00e9nial pour lui.  Je conseille ce karting.","rating":5,"date":"2026-08-05 07:46:08 +00:00","owner_response":"Merci Amandine ! C\u2019est exactement le genre de retour qu\u2019on adore lire. Voir un enfant de 8 ans prendre le volant seul pour la premi\u00e8re fois, avec son fr\u00e8re et son papa sur la piste, c\u2019est aussi \u00e7a l\u2019esprit MECAMAX. Merci pour votre confiance et \u00e0 bient\u00f4t pour la revanche en famille !"},{"text":"Une des plus belles pistes sur laquelle j\u2019ai pu rouler. Piste technique et karting qui tient tr\u00e8s bien la route m\u00eame dans les freinages appuy\u00e9s en virage. Apr\u00e8s un temps sous les 49 secondes en kart adulte j\u2019ai pu tester le kart 2 temps qui est juste exceptionnel. Cela demande beaucoup de pr\u00e9cision pour le manier et d\u2019efforts dans les bras.\nMerci au staff pour l\u2019accueil, la qualit\u00e9 du briefing et la sympathie de tous.\n\nBelle saison \u00e0 vous","rating":5,"date":"2026-07-23 12:10:22 +00:00","owner_response":"Merci infiniment pour ce superbe retour.<br><br>Nous sommes ravis que notre piste et le Racing 125 vous aient autant plu. Vous d\u00e9crivez parfaitement le d\u00e9fi qu'il repr\u00e9sente : pr\u00e9cision, engagement et technique sont indispensables pour en tirer le meilleur.<br><br>Merci \u00e9galement pour vos compliments envers toute l'\u00e9quipe. Au plaisir de vous revoir pour aller chercher un chrono encore plus rapide."},{"text":"Super circuit dans son trac\u00e9 et son mat\u00e9riel. Les membres de l'\u00e9quipe sont tous super sympas. Je reviendrai avec grand plaisir sous une journ\u00e9e moins chaude haha (il faut que je passe sous les 47s)","rating":5,"date":"2026-07-12 07:14:28 +00:00","owner_response":"Bonjour Isao,<br>Merci pour votre excellent retour ! Nous sommes ravis que le trac\u00e9, le mat\u00e9riel et l'accueil de notre \u00e9quipe vous aient plu. \ud83d\ude0a<br>Pour le chrono, l'objectif est lanc\u00e9 ! \ud83d\udcaa Rendez-vous sous une m\u00e9t\u00e9o un peu plus cl\u00e9mente pour aller chercher ce passage sous les 47 secondes. On vous attend avec plaisir ! \ud83c\udfc1"},{"text":"Excellent circuit de kart un staf comp\u00e9tant et agr\u00e9able.\nLes infrastructures et les engins sont tr\u00e8s bien entretenu, nous nous sommes vraiment bien amus\u00e9s.","rating":5,"date":"2026-08-02 06:36:12 +00:00","owner_response":"Merci beaucoup pour votre retour ! Ravi que vous ayez appr\u00e9ci\u00e9 le circuit, la qualit\u00e9 de nos karts et surtout l\u2019accueil de notre \u00e9quipe. On travaille chaque jour pour que le plaisir sur la piste soit au rendez-vous, alors lire que vous vous \u00eates vraiment bien amus\u00e9s, c\u2019est mission accomplie !<br><br>\u00c0 bient\u00f4t chez MECAMAX pour remettre \u00e7a !"}],"place_topics":null,"booking_url":null,"cid":"1651000549634778806","place_id":"ChIJxfpR-apcBEgRtqb0pECI6RY","wikipedia_description":null,"description_short":"Sensations garanties sur l'un des circuits karting les plus techniques de Vend\u00e9e, accessible d\u00e8s 8 ans !","description_long":"Le Circuit Mecamax, situ\u00e9 \u00e0 L'\u00cele-d'Olonne, vous invite \u00e0 vivre une exp\u00e9rience de karting inoubliable sur une piste technique et exigeante. Que vous soyez d\u00e9butant ou pilote confirm\u00e9, l'\u00e9quipe passionn\u00e9e et bienveillante assure un accueil chaleureux et des explications claires sur les consignes de s\u00e9curit\u00e9. Les karts, parfaitement entretenus, offrent d'excellentes sensations m\u00eame en freinages appuy\u00e9s en virage. Les enfants \u00e0 partir de 8 ans peuvent prendre le volant accompagn\u00e9s, pour une premi\u00e8re exp\u00e9rience m\u00e9morable. Un spot incontournable pour les amateurs de vitesse et de sensations en Vend\u00e9e.","tags":["karting","circuit","sensations","vitesse","loisirs"],"audience":["famille","couple","solo","ados"],"age_min":8,"weather_ok":["sunny","cloudy"],"duration_min":90,"notoriety":"pepite","accessibility":{"wheelchair":false,"walking_difficulty":false,"stroller":false},"dogs_allowed":false,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"En famille, venez en semaine ou en d\u00e9but de soir\u00e9e pour \u00e9viter l'affluence et profiter pleinement des pistes avec les enfants. Les pilotes en qu\u00eate de chrono, visez les sessions creuses pour gratter ces pr\u00e9cieuses secondes !","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T16:25:30.373622+00:00","enriched_at":"2026-09-14T16:25:30.373622+00:00","status":"complete","photos_original_urls":[]},{"id":"atlantic_kart_system","name":"Atlantic Kart System","name_google":"Atlantic Kart System-karting les Sables d'Olonne","category":"Parcs & Loisirs","subcategory":"Jeux & Divertissement","commune":"Les Sables-d'Olonne","zone":null,"poi_format":"poi","lat":46.509119299999995,"lng":-1.6859427,"address":"Lieu dit Le Coudriou, 85180","phone":"+33251325252","website":"http://www.akskart.fr/","rating":4.5,"reviews_count":604,"rating_distribution":{"1":47,"2":7,"3":15,"4":70,"5":465},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/atlantic_kart_system/photo_1.jpg","images/atlantic_kart_system/photo_2.jpg","images/atlantic_kart_system/photo_3.jpg"],"reviews":[{"text":"Excellente journ\u00e9e du d\u00e9but \u00e0 la fin !\n\nUn grand merci \u00e0 toute l\u2019\u00e9quipe pour son accueil, son professionnalisme et la qualit\u00e9 de l\u2019organisation. Nous avons pass\u00e9 un tr\u00e8s bon moment dans une ambiance conviviale et pleine de bonne humeur.\n\nLa pluie a-t-elle fait gagner les filles ou est-ce simplement leur talent ? Le d\u00e9bat reste ouvert\u2026 \ud83d\ude04 Quoi qu\u2019il en soit, cela a donn\u00e9 lieu \u00e0 quelques belles glissades, beaucoup de rires et de tr\u00e8s bons souvenirs.\n\nUne activit\u00e9 parfaite pour partager un moment d\u2019\u00e9quipe. Nous recommandons sans h\u00e9siter !\n\nEncore merci et excellente saison \u00e0 toute l\u2019\u00e9quipe.","rating":5,"date":"2026-06-14 09:19:10 +00:00","owner_response":"Merci beaucoup pour votre confiance et cet avis, une excellente saison \u00e0 vous !!!"},{"text":"\u00c9quipe au top\nExcellent trac\u00e9 de 1000m avec virages vari\u00e9s.\nKart neuf (270cc pour nous, largement suffisant pour une d\u00e9couverte du circuit)\nFormule 3x10min (Essai libre, course, finale) pour 55\u20ac. \u00c7a les vaut sans soucis et donne envie d'y revenir.","rating":5,"date":"2026-03-29 19:09:46 +00:00","owner_response":null},{"text":"Un accueil et une proximit\u00e9 comme il en existe peu\u2026 ma fille de 9 ans avait tr\u00e8s peur pour sa \u00ab\u00a0premi\u00e8re fois\u00a0\u00bb.\nLe patron l\u2019a accompagn\u00e9 et l\u2019a vraiment rassur\u00e9 avec bienveillance patience et passion. Elle n\u2019a plus qu\u2019une envie\u2026 En refaire!!!\nMerci pour votre authenticit\u00e9 et votre sourire !!\nNous reviendrons \u263a\ufe0f","rating":5,"date":"2026-07-20 13:10:07 +00:00","owner_response":"Un r\u00e9el plaisir de partager notre passion avec de jeunes pilotes \ud83d\ude09"},{"text":"Premi\u00e8re fois que nous venons,et mon ado de 16 ans \u00e0 ador\u00e9.\nUn grand merci \u00e0 la propri\u00e9taire pour l'accueil chaleureux et pour sa gentillesse, merci \u00e9galement d'avoir accept\u00e9 mon chien ( un cocker ) et merci pour la petite friandise \ud83e\udee3\ud83d\ude05.\n\n'ous reviendrons c'est sur","rating":5,"date":"2026-07-07 15:06:48 +00:00","owner_response":"Avec plaisir \u263a\ufe0f<br>\u00c0 bient\u00f4t \ud83d\ude09"},{"text":"Accueil chaleureux par la g\u00e9rante, piste agr\u00e9able et karts performants. Cependant, je d\u00e9conseille fortement d'y amener de jeunes conducteurs. Le g\u00e9rant a \u00e9t\u00e9 insultant envers un jeune (et sa famille m\u00e9dus\u00e9e). Ce jeune avait fait correctement son tour, sans g\u00eaner nullement les autres karts. A l'arriv\u00e9e,  o\u00f9 il a renvers\u00e9 un pneu, il a \u00e9t\u00e9 surpris d'\u00eatre insult\u00e9 par le g\u00e9rant en des termes violents et visant \u00e0 le d\u00e9courager. Ses cousins, t\u00e9moins, ont bien r\u00e9confort\u00e9 le jeune. Grand manque de p\u00e9dagogie de la part de ce g\u00e9rant .....qui devrait peut-\u00eatre r\u00e9fl\u00e9chir \u00e0 se r\u00e9orienter, avant de faire d'autres d\u00e9g\u00e2ts aupr\u00e8s des jeunes.","rating":1,"date":"2026-07-23 09:38:15 +00:00","owner_response":"Bonjour,<br>Merci d'avoir pris le temps de partager votre ressenti. Nous sommes heureux que vous ayez appr\u00e9ci\u00e9 l'accueil, la qualit\u00e9 de notre piste et de de nos karts.<br>Nous sommes toutefois d\u00e9sol\u00e9s que cette situation ait terni votre exp\u00e9rience.<br>Chez AKS, la s\u00e9curit\u00e9 est et restera toujours notre priorit\u00e9. Avant chaque session, un briefing est r\u00e9alis\u00e9 afin d'expliquer les r\u00e8gles de pilotage et les consignes \u00e0 respecter. Elles ne sont pas l\u00e0 pour contraindre les pilotes, mais pour permettre \u00e0 chacun, enfants comme adultes, de profiter de l'activit\u00e9 en toute s\u00e9curit\u00e9.<br>Il peut arriver que nous soyons amen\u00e9s \u00e0 rappeler ces r\u00e8gles avec rigueur lorsque nous estimons que la s\u00e9curit\u00e9 sur la piste l'exige. Ce n'est jamais dans le but de d\u00e9courager un pilote, mais bien de prot\u00e9ger l'ensemble des participants et le staff pour garantir le bon d\u00e9roulement de la session.<br>Depuis 25 ans, nous accueillons avec plaisir des familles, des groupes, des entreprises et de jeunes pilotes. Nous avons \u00e0 coeur de leur faire vivre un moment convivial, tout en veillant au respect des r\u00e8gles qui permettent \u00e0 chacun de profiter de l'exp\u00e9rience dans les meilleures conditions.<br>Nous vous souhaitons une bonne continuation."}],"place_topics":{"\u00e9quipe":39,"moniteurs":14,"chiens":11,"sensations":9,"souriant":14,"biplace":7,"pneu":7,"vacances":20,"p\u00e9dagogie":5,"patronne":5},"booking_url":null,"cid":"2880320761602315185","place_id":"ChIJoy4sKPlBBEgRsRN92nj0-Cc","wikipedia_description":null,"description_short":"La plus grande piste de kart du littoral vend\u00e9en sur 1 km de sensations ! D\u00e8s 7 ans, seul ou en famille, foncez \u00e0 toute allure.","description_long":"Atlantic Kart System vous invite \u00e0 d\u00e9valer le kilom\u00e8tre de piste le plus long du littoral vend\u00e9en, au volant de karts modernes et puissants (270 cc). Accessible d\u00e8s 7 ans, le circuit propose des virages vari\u00e9s pour toutes les envies : essais libres, courses chronom\u00e9tr\u00e9es, endurances ou grandes finales. L'\u00e9quipe, reconnue pour son professionnalisme et sa bienveillance, accompagne aussi bien les petits d\u00e9butants que les pilotes en herbe. Id\u00e9al pour les EVG, EVJF et team-building, Atlantic Kart garantit une exp\u00e9rience conviviale et inoubliable \u00e0 partager en famille, entre amis ou entre coll\u00e8gues.","tags":["kart","vitesse","sensations","piste outdoor","comp\u00e9tition"],"audience":["famille","couple","ados","solo"],"age_min":7,"weather_ok":["sunny","cloudy"],"duration_min":60,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":true,"stroller":false},"dogs_allowed":true,"is_indoor":false,"has_height":false,"animals_captive":false,"rainy_day_activity":false,"conseil_planly":"En famille, optez pour les karts biplace pour que les plus jeunes (d\u00e8s 7 ans) profitent de l'adr\u00e9naline en toute s\u00e9curit\u00e9 aux c\u00f4t\u00e9s d'un adulte. R\u00e9servez en avance en haute saison vend\u00e9enne, les cr\u00e9neaux partent vite !","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T16:25:30.888368+00:00","enriched_at":"2026-09-14T16:25:30.888368+00:00","status":"complete","photos_original_urls":["https://cdt85.media.tourinsoft.eu/upload/2023-D-AtlanticKartSystem-2-1.jpg","https://www.enpaysdelaloire.com/sites/default/files/styles/ogimage/public/sit/images/LOIPDL085V514L16/Arrivee-mondial-atlantickart-system.jpg?itok=H1lPb8T1","https://dynamic-media-cdn.tripadvisor.com/media/photo-o/1d/ae/2a/80/atlantic-kart-system.jpg?w=1100&h=1100&s=1"]},{"id":"up2play","name":"UP2PLAY","name_google":"UP2PLAY Les Sables d'Olonne","category":"Parcs & Loisirs","subcategory":"Jeux & Divertissement","commune":"Les Sables-d'Olonne","zone":null,"poi_format":"poi","lat":46.5142428,"lng":-1.7809118,"address":"Centre Commercial YLIUM, 87 Av. Fran\u00e7ois Mitterrand, 85100 Les Sables-d'Olonne","phone":"+33255890300","website":"https://www.up2play.fr/lessablesdolonne/","rating":4.6,"reviews_count":2189,"rating_distribution":{"1":88,"2":41,"3":58,"4":252,"5":1750},"opening_hours":null,"popular_times":null,"price_level":null,"photos":[],"reviews":[{"text":"Complexe de sports et de loisirs situ\u00e9 dans la galerie commerciale, adapt\u00e9 aussi bien aux enfants qu\u2019aux adultes.\nLe lieu a r\u00e9cemment \u00e9t\u00e9 r\u00e9am\u00e9nag\u00e9 avec l\u2019installation de nouveaux jeux.\nOn y trouve notamment une table de shuffleboard (10 \u20ac/h), une table de ping-pong (5 \u20ac/h), un jeu de cornhole (5 \u20ac/h) ainsi qu\u2019un jeu de palets.\nUn \u00e9cran g\u00e9ant a \u00e9galement \u00e9t\u00e9 install\u00e9 pour suivre des matchs, notamment de football et de rugby.\nUn distributeur automatique de pop-corn.\nIl est aussi possible de profiter du bowling, du billard, du baby-foot (1 \u20ac la partie), des fl\u00e9chettes (3 cibles \u00e9lectroniques) et de plusieurs bornes d\u2019arcade.\nLe complexe propose \u00e9galement un trampoline park, un escape game, un kids park et une vague de surf.\nUn endroit id\u00e9al pour s\u2019amuser en famille ou entre amis !","rating":5,"date":"2026-03-14 23:53:10 +00:00","owner_response":"Bonjour Jimmy MOREL, nous vous remercions d'avoir pris le temps de nous faire votre retour d'exp\u00e9rience. Votre commentaire nous fait tr\u00e8s plaisir, nous sommes heureux que notre complexe vous plaise. Au plaisir de vous revoir !"},{"text":"Salle de jeu propre, spacieuse avec une d\u00e9coration tr\u00e8s sympa ! Nous avons profit\u00e9 de l\u2019offre une partie de bowling achet\u00e9e = une partie offerte et nous avons \u00e9t\u00e9 ravis. Le personnel est \u00e9galement chaleureux et accueillant. Je recommande !","rating":5,"date":"2026-05-17 18:02:34 +00:00","owner_response":"Bonjour lea mr, nous vous remercions d'avoir pris le temps de nous faire votre retour d'exp\u00e9rience. Nous sommes heureux que notre complexe vous plaise. Au plaisir de vous revoir !"},{"text":"Nous pensions profiter d'un grand espace de kid parc au final espace confin\u00e9 impossible de consommer des boissons dans l'espace du kid park.... donc oblig\u00e9 de faire sortir l'enfant a chaque fois qu'il veut boire ! Manque de climatisation pour un espace ou les enfants jouent cours sautent... nous \u00e9tions ici que de passage mais c'est pas le meilleur kid park que nous avons fait !","rating":3,"date":"2026-06-24 09:22:06 +00:00","owner_response":"Bonjour lucie roussel, votre avis est tr\u00e8s important pour nous, et nous sommes au regret de constater que votre exp\u00e9rience UP2PLAY n\u2019ait pas \u00e9t\u00e9 \u00e0 la hauteur de vos attentes. <br><br>Effectivement, pour des raisons de propret\u00e9, la consommation de boissons doit se faire \u00e0 l\u2019ext\u00e9rieur du Kids Parc. En revanche, les gourdes d\u2019eau sont bien entendu autoris\u00e9es \u00e0 l\u2019int\u00e9rieur afin que les enfants puissent s\u2019hydrater facilement.<br><br>Concernant la climatisation, nous prenons en compte votre remarque et allons \u00eatre vigilants sur ce point.<br><br>Au plaisir de vous revoir."},{"text":"De passage dans la r\u00e9gion et joueurs de bowling depuis pr\u00e8s de 10 ans, nous avions vraiment h\u00e2te de d\u00e9couvrir ce lieu !\n\nPremier petit coup de frein : le prix. Presque 20 \u20ac pour une seule partie \u00e0 deux, c'est quasiment le double de ce que nous payons habituellement. Nous aurions volontiers accept\u00e9 ce tarif si le mat\u00e9riel avait \u00e9t\u00e9 \u00e0 la hauteur, mais ce n'\u00e9tait malheureusement pas le cas.\n\nLa piste est vraiment us\u00e9e par le temps, tout comme les boules, les fauteuils et les chaussures. D'ailleurs, tr\u00e8s peu de pointures \u00e9taient disponibles, ce qui complique encore un peu plus l'exp\u00e9rience. Les chaussures mises \u00e0 disposition \u00e9taient \u00e9galement en mauvais \u00e9tat.\n\nL'\u00e9tat g\u00e9n\u00e9ral des \u00e9quipements rendait les trajectoires tr\u00e8s al\u00e9atoires et le jeu vraiment difficile. En 10 ans de pratique, c'est bien la premi\u00e8re fois que nous avons autant de mal \u00e0 terminer une partie tant le mat\u00e9riel d\u00e9grade l'exp\u00e9rience.\n\nFranchement dommage, car le coin arcade et la salle en g\u00e9n\u00e9ral sont tr\u00e8s sympathiques, chaleureux et plut\u00f4t bien entretenus. Le contraste est vraiment frappant.","rating":3,"date":"2026-07-22 16:26:32 +00:00","owner_response":"Bonjour Jean Renard, votre avis est tr\u00e8s important pour nous, et nous sommes au regret de constater que votre exp\u00e9rience UP2PLAY n\u2019ait pas \u00e9t\u00e9 \u00e0 la hauteur de vos attentes.<br><br>Nous sommes toutefois surpris par votre retour, car c'est la premi\u00e8re fois que nous recevons ce type de remarque concernant notre bowling.<br><br>Notre mat\u00e9riel est un \u00e9quipement QubicaAMF de derni\u00e8re g\u00e9n\u00e9ration, install\u00e9 lors de l'ouverture du complexe en 2020, et nos pistes sont huil\u00e9es chaque semaine. Nous sommes \u00e9galement en attente de la livraison de nouvelles chaussures.<br><br>Nous organisons r\u00e9guli\u00e8rement des tournois et des initiations, et les retours de nos joueurs sont g\u00e9n\u00e9ralement tr\u00e8s positifs. Nous sommes n\u00e9anmoins d\u00e9sol\u00e9s que votre exp\u00e9rience n'ait pas \u00e9t\u00e9 \u00e0 la hauteur de vos attentes et prenons en compte votre ressenti.<br><br>Au plaisir de vous accueillir \u00e0 nouveau."},{"text":"C\u2019est vraiment un tr\u00e8s bel endroit, mon fils adore, il y a vraiment tout pour passer une belle apr\u00e8s-midi quand le temps ne s\u2019y pr\u00eate pas aux Sables d\u2019Olonne ! Vraiment top, je recommande !","rating":5,"date":"2026-05-17 09:20:27 +00:00","owner_response":"Bonjour David Bapst, nous vous remercions pour cet excellent avis qui nous fait tr\u00e8s plaisir ! Nous sommes ravis que notre complexe vous plaise. Au plaisir de vous accueillir tr\u00e8s bient\u00f4t !"}],"place_topics":{"bowling":155,"surf":84,"fort boyard":25,"billard":35,"cocktails":31,"quiz":21,"arcade":17,"fl\u00e9chettes":11,"boxing":8,"avec les copains":6},"booking_url":null,"cid":"3102875307359427728","place_id":"ChIJG3nB51FdBEgRkFx9_aagDys","wikipedia_description":null,"description_short":"Bowling, trampolines, escape game, surf indoor\u2026 3 500 m\u00b2 de fun pour petits et grands aux Sables d'Olonne !","description_long":"UP2PLAY, c'est le complexe de loisirs incontournable des Sables d'Olonne, nich\u00e9 au c\u0153ur du centre commercial Ylium. Sur 3 500 m\u00b2, il r\u00e9unit 8 pistes de bowling derni\u00e8re g\u00e9n\u00e9ration, un trampoline parc avec parcours Ninja Warrior, un kids parc d\u00e8s 1 an, deux salles d'escape game, un espace r\u00e9alit\u00e9 virtuelle, des jeux d'arcade, du billard, des fl\u00e9chettes\u2026 et m\u00eame une vague de surf indoor ! Un bar lounge compl\u00e8te l'ensemble pour se retrouver entre amis ou en famille. Ouvert 7j/7, jusqu'\u00e0 2h du matin le week-end, le lieu propose aussi des offres anniversaires, EVG/EVJF et team building.","tags":["bowling","trampoline","escape game","surf indoor","kids parc"],"audience":["famille","couple","ados","solo"],"age_min":1,"weather_ok":["sunny","cloudy","rainy"],"duration_min":90,"notoriety":"incontournable","accessibility":{"wheelchair":true,"walking_difficulty":true,"stroller":true},"dogs_allowed":false,"is_indoor":true,"has_height":false,"animals_captive":false,"rainy_day_activity":true,"conseil_planly":"En famille, privil\u00e9giez un cr\u00e9neau en semaine pour \u00e9viter l'affluence et profiter pleinement du kids parc et du bowling. Entre amis ou en soir\u00e9e, venez le week-end : le bar lounge et les pistes de bowling sont anim\u00e9s jusqu'\u00e0 2h du matin !","specific":{},"specific_status":{},"parking_main":null,"parking_others":[],"scraped_at":"2026-09-14T16:25:47.087264+00:00","enriched_at":"2026-09-14T16:25:47.087264+00:00","status":"complete","photos_original_urls":[]},{"id":"parc_des_sablotins","name":"Parc des Sablotins","name_google":"Parc de loisirs des Sablotins","category":"Parcs & Loisirs","subcategory":"Jeux & Divertissement","commune":"Les Sables-d'Olonne","zone":null,"poi_format":"poi","lat":46.4871592,"lng":-1.7326214999999998,"address":"17 Av. Louis Breguet, 85180 Les Sables-d'Olonne","phone":"+33251010946","website":"http://www.sablotins.com/","rating":4.8,"reviews_count":695,"rating_distribution":{"1":7,"2":6,"3":15,"4":88,"5":579},"opening_hours":null,"popular_times":null,"price_level":null,"photos":["images/parc_des_sablotins/photo_1.jpg","images/parc_des_sablotins/photo_2.jpg","images/parc_des_sablotins/photo_3.jpg"],"reviews":[{"text":"Parfait pour les enfants, ils s'amusent. \u00c9galement pour les parents, ils se reposent.\nDans son genre, ce parc est tr\u00e8s calme avec un niveau sonore peu \u00e9lev\u00e9.","rating":5,"date":"2026-07-18 14:15:33 +00:00","owner_response":"Merci beaucoup pour votre avis !<br><br>Nous sommes ravis que les enfants aient pass\u00e9 un bon moment et que les parents aient pu profiter d'un moment de d\u00e9tente. Nous attachons une grande importance \u00e0 offrir un espace agr\u00e9able pour toute la famille.<br>Au plaisir de vous accueillir \u00e0 nouveau au parc des Sablotins !"},{"text":"Pas facile d'acc\u00e8s petit parking mais c'est un tr\u00e8s bon moment pour tout les enfants  il y a des attractions pour les petits de 2 ans jusqu'\u00e0 12 le parc  accepte jusqu'\u00e0 14 ans mais pour moi je trouve qu\u2019ils pr\u00e9f\u00e9raient faire autre chose il y \u00e0 aussi des activit\u00e9s ext\u00e9rieures mais il ne faisait pas tr\u00e8s chaud. Je vous le conseille vivement pour passer un bon apr\u00e8s-midi","rating":5,"date":"2026-04-14 08:39:31 +00:00","owner_response":"Merci beaucoup pour votre super retour et votre recommandation \ud83d\ude0a<br>Nous sommes ravis que vous ayez pass\u00e9 un bon moment aux Sablotins et que les enfants aient pu profiter des diff\u00e9rentes attractions !<br><br>Effectivement, notre parking n'est pas immense mais heureusement, il y a de nombreuses places aux alentours, mais nous sommes heureux de voir que cela n\u2019a pas g\u00e2ch\u00e9 votre exp\u00e9rience.<br>Les enfants grandissent chacun \u00e0 leur vitesse, certains s'amusent encore dans les structures et d'autres pr\u00e9f\u00e8rent prendre les options espace ext\u00e9rieur et/ou laser game. L'essentiel est de garder son \u00e2me d'enfant...<br><br>Nous esp\u00e9rons que vous aurez l\u2019occasion de revenir profiter \u00e9galement des espaces ext\u00e9rieurs par une m\u00e9t\u00e9o plus cl\u00e9mente \ud83c\udf1e<br><br>\u00c0 tr\u00e8s bient\u00f4t aux Sablotins !"},{"text":"Que dire si ce n\u2019est EXCEPTIONNEL !\nL\u2019accueil est des plus agr\u00e9ables, la qualit\u00e9 de la structure dans son ensemble est irr\u00e9prochable.\nNous avons \u00e9norm\u00e9ment appr\u00e9ci\u00e9 notre sortie sur ce lieu et nous la recommandons sans h\u00e9siter !\nRendez tous visite au parc des Sablotins pour un superbe apr\u00e8s-midi en famille Oe en ALSH !","rating":5,"date":"2026-07-30 09:14:19 +00:00","owner_response":"Anatole, un immense merci pour ce magnifique commentaire !<br><br>Toute l'\u00e9quipe est tr\u00e8s touch\u00e9e par vos mots. Nous sommes ravis que vous ayez appr\u00e9ci\u00e9 l'accueil, les installations et votre apr\u00e8s-midi au parc des Sablotins. Votre recommandation est la plus belle des r\u00e9compenses pour notre \u00e9quipe. Nous sommes \u00e9galement tr\u00e8s heureux de vous avoir accueillis, votre team \u00e9tait tr\u00e8s sympa...<br><br>Au plaisir de vous accueillir \u00e0 nouveau lors de votre prochaine visite !"},{"text":"Mon fils de 18 mois a ador\u00e9 e ion baln\u00e9aire vivante, les commerces et restaurants s'adaptent pour accueillir au mieux les visiteurs, notamment avec leurs terrasses. Nos parcours \u00e9tant construits directement sur l'architecture locale et les fa\u00e7ades, les al\u00e9as de la rue peuvent parfois jouer des tours. Nous allons \u00eatre particuli\u00e8rement vigilants \u00e0 l'avenir pour garantir la visibilit\u00e9 de cette \u00e9nigme, m\u00eame aux heures de forte activit\u00e9.<br><br>Nous esp\u00e9rons que vous garderez malgr\u00e9 tout un bon souvenir de votre passage aux Sables d'Olonne et nous serions ravis de vous mettre \u00e0 l'\u00e9preuve \u00e0 nouveau sur un autre parcours si vous repassez dans le coin !"},{"text":"Nous avons ador\u00e9 ce jeu de piste \u00ab\u00a0escape game\u00a0\u00bb en ext\u00e9rieur en famille ! Cela nous a permis de red\u00e9couvrir des petites rues des Sables D\u2019olonne mais aussi d\u2019apprendre quelques petits bouts d\u2019histoire sur certains b\u00e2timents. Les \u00e9nigmes sont super \ud83d\udc4d on s\u2019est r\u00e9gal\u00e9 ! On reviendra tester un autre sc\u00e9nario \u00e7a c\u2019est certain !","rating":5,"date":"2026-05-11 16:57:29 +00:00","owner_response":"Merci beaucoup pour ce super avis ! Quel plaisir de lire que vous avez ador\u00e9 red\u00e9couvrir les Sables d\u2019Olonne et son histoire en famille. Toute l'\u00e9quipe a le sourire en vous lisant. Le rendez-vous est pris pour votre prochain sc\u00e9nario, nous vous attendons pour un nouveau d\u00e9fi ! \u00c0 bient\u00f4t !"},{"text":"Super escape fait maison , d\u00e9roulement parfait  et game master au top\nN h\u00e9sitez pas \u00e0 y aller","rating":5,"date":"2026-05-06 14:49:05 +00:00","owner_response":"Merci pour ce retour et votre recommandation ! En tant que cr\u00e9ateurs, savoir que notre escape game \u00ab fait maison \u00bb vous a s\u00e9duit et que le d\u00e9roulement a \u00e9t\u00e9 parfait est notre plus belle r\u00e9compense. Nous transmettons vos compliments \u0
